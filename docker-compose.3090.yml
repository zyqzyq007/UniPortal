# 3090 服务器生产部署 override
# 使用方式:
#   docker compose -f docker-compose.yml -f docker-compose.3090.yml up -d --build
#
# 前置条件:
#   - 安装 nvidia-container-toolkit (使 --gpus all 在容器内可用)
#
# 本 override 做的事:
#   1. ollama 服务: 容器化本地 LLM (qwen3:14b), GPU 推理, 模型持久化
#   2. rag 服务: 用专用 Dockerfile.rag-local 安装 local-models (torch cu124 + BGE-M3 + reranker)
#      embedding/reranker 走本地 GPU, LLM 走同网络的 ollama 服务
#   3. 全部 GPU 通过 deploy.resources 声明
services:
  # ----------------------------------------------------------
  # Ollama: 本地 LLM 推理服务 (容器化, 无需在宿主机安装)
  # RAG 通过同 compose 网络的服务名 http://ollama:11434 访问
  # 模型在首次问答时自动拉取 (qwen3:14b ~8GB), 持久化到命名卷
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: uni-ollama
    ports:
      - "11434:11434"
    volumes:
      - uniportal_ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  rag:
    build:
      # RAG 源码已收编为本仓库 rag/ 子目录, 自主维护
      # dockerfile 为 UniPortal 侧的 local-models 构建文件 (相对 context ./rag 解析)
      dockerfile: ../Dockerfile.rag-local
    depends_on:
      - ollama
    environment:
      # ── Embedding: 本地 BGE-M3 (GPU) ──
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_DIMENSION=1024
      - EMBEDDING_DEVICE=cuda
      # ── Reranker: 本地 (GPU) ──
      - RERANKER_ENABLED=true
      - RERANKER_DEVICE=cuda
      # ── LLM: 同网络的 ollama 服务 ──
      # compose 网络内用服务名 ollama 解析; 模型默认 qwen3:14b (RAG 代码原生支持)
      - OPENAI_BASE_URL=${RAG_LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${RAG_LLM_MODEL:-qwen3:14b}
      # Ollama 本地无需鉴权, 占位避免客户端报错
      - OPENAI_API_KEY=${RAG_LLM_API_KEY:-ollama}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Ollama 模型持久化卷
volumes:
  uniportal_ollama:
    driver: local
    name: uniportal_ollama
