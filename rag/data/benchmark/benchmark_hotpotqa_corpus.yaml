  source: hotpot:Leonid Ramzin
  title: Leonid Ramzin
  text: 'Leonid Konstantinovich Ramzin (Russian: Леони́д Константи́нович Рамзи́н )
    (1887–1948) was a Soviet thermal engineer, and the inventor of a type of flow-through
    boiler known as the straight-flow boiler, or Ramzin boiler.  He was a laureate
    of the Stalin Prize First-Class, which he received in 1943.'
