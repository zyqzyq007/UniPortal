  source: hotpot:2009 Serena Williams tennis season
  title: 2009 Serena Williams tennis season
  text: Serena Williams's 2009 tennis season officially began at the 2009 Medibank
    International Sydney.  Williams finished the year ranked world no. 1 for the second
