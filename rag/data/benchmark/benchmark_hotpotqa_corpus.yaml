chunks:
- id: dffdf9f5bfce
  source: hotpot:Radio City (Indian radio station)
  title: Radio City (Indian radio station)
  text: Radio City is India's first private FM radio station and was started on 3
    July 2001.  It broadcasts on 91.1 (earlier 91.0 in most cities) megahertz from
    Mumbai (where it was started in 2004), Bengaluru (started first in 2001), Lucknow
    and New Delhi (since 2003).  It plays Hindi, English and regional songs.  It was
    launched in Hyderabad in March 2006, in Chennai on 7 July 2006 and in Visakhapatnam
    October 2007.  Radio City recently forayed into New Media in May 2008 with the
    launch of a music portal - PlanetRadiocity.com that offers music related news,
    videos, songs, and other music-related features.  The Radio station currently
    plays a mix of Hindi and Regional music.  Abraham Thomas is the CEO of the company.
- id: e1c93f488b89
  source: hotpot:History of Albanian football
  title: History of Albanian football
  text: Football in Albania existed before the Albanian Football Federation (FSHF)
    was created.  This was evidenced by the team's registration at the Balkan Cup
    tournament during 1929-1931, which started in 1929 (although Albania eventually
    had pressure from the teams because of competition, competition started first
    and was strong enough in the duels) .  Albanian National Team was founded on June
    6, 1930, but Albania had to wait 16 years to play its first international match
    and then defeated Yugoslavia in 1946.  In 1932, Albania joined FIFA (during the
    12–16 June convention ) And in 1954 she was one of the founding members of UEFA.
- id: 1cf93edbdcc1
  source: hotpot:Echosmith
  title: Echosmith
  text: Echosmith is an American, Corporate indie pop band formed in February 2009
    in Chino, California.  Originally formed as a quartet of siblings, the band currently
    consists of Sydney, Noah and Graham Sierota, following the departure of eldest
    sibling Jamie in late 2016.  Echosmith started first as "Ready Set Go!"  until
    they signed to Warner Bros.  Records in May 2012.  They are best known for their
    hit song "Cool Kids", which reached number 13 on the "Billboard" Hot 100 and was
    certified double platinum by the RIAA with over 1,200,000 sales in the United
    States and also double platinum by ARIA in Australia.  The song was Warner Bros.  Records'
    fifth-biggest-selling-digital song of 2014, with 1.3 million downloads sold.  The
    band's debut album, "Talking Dreams", was released on October 8, 2013.
- id: 211c0f39b067
  source: hotpot:Women's colleges in the Southern United States
  title: Women's colleges in the Southern United States
  text: Women's colleges in the Southern United States refers to undergraduate, bachelor's
    degree–granting institutions, often liberal arts colleges, whose student populations
    consist exclusively or almost exclusively of women, located in the Southern United
    States.  Many started first as girls' seminaries or academies.  Salem College
    is the oldest female educational institution in the South and Wesleyan College
    is the first that was established specifically as a college for women.  Some schools,
    such as Mary Baldwin University and Salem College, offer coeducational courses
    at the graduate level.
- id: 1b048d7b2279
  source: hotpot:First Arthur County Courthouse and Jail
  title: First Arthur County Courthouse and Jail
  text: The First Arthur County Courthouse and Jail, was perhaps the smallest court
    house in the United States, and serves now as a museum.
- id: c04086466fc4
  source: hotpot:Arthur's Magazine
  title: Arthur's Magazine
  text: Arthur's Magazine (1844–1846) was an American literary periodical published
    in Philadelphia in the 19th century.  Edited by T.S. Arthur, it featured work
    by Edgar A. Poe, J.H. Ingraham, Sarah Josepha Hale, Thomas G. Spear, and others.  In
    May 1846 it was merged into "Godey's Lady's Book".
- id: 0e122b4f2090
  source: hotpot:2014–15 Ukrainian Hockey Championship
  title: 2014–15 Ukrainian Hockey Championship
  text: The 2014–15 Ukrainian Hockey Championship was the 23rd season of the Ukrainian
    Hockey Championship.  Only four teams participated in the league this season,
    because of the instability in Ukraine and that most of the clubs had economical
    issues.  Generals Kiev was the only team that participated in the league the previous
    season, and the season started first after the year-end of 2014.  The regular
    season included just 12 rounds, where all the teams went to the semifinals.  In
    the final, ATEK Kiev defeated the regular season winner HK Kremenchuk.
- id: 143d89c1cd19
  source: hotpot:First for Women
  title: First for Women
  text: First for Women is a woman's magazine published by Bauer Media Group in the
    USA.  The magazine was started in 1989.  It is based in Englewood Cliffs, New
    Jersey.  In 2011 the circulation of the magazine was 1,310,696 copies.
- id: 968b8ab5376a
  source: hotpot:Freeway Complex Fire
  title: Freeway Complex Fire
  text: The Freeway Complex Fire was a 2008 wildfire in the Santa Ana Canyon area
    of Orange County, California.  The fire started as two separate fires on November
    15, 2008.  The "Freeway Fire" started first shortly after 9am with the "Landfill
    Fire" igniting approximately 2 hours later.  These two separate fires merged a
    day later and ultimately destroyed 314 residences in Anaheim Hills and Yorba Linda.
- id: ffe5d5d5325c
  source: hotpot:William Rast
  title: William Rast
  text: William Rast is an American clothing line founded by Justin Timberlake and
    Trace Ayala.  It is most known for their premium jeans.  On October 17, 2006,
    Justin Timberlake and Trace Ayala put on their first fashion show to launch their
    new William Rast clothing line.  The label also produces other clothing items
    such as jackets and tops.  The company started first as a denim line, later evolving
    into a men’s and women’s clothing line.
- id: 4f57b2ce6404
  source: hotpot:Ritz-Carlton Jakarta
  title: Ritz-Carlton Jakarta
  text: The Ritz-Carlton Jakarta is a hotel and skyscraper in Jakarta, Indonesia and
    14th Tallest building in Jakarta.  It is located in city center of Jakarta, near
    Mega Kuningan, adjacent to the sister JW Marriott Hotel.  It is operated by The
    Ritz-Carlton Hotel Company.  The complex has two towers that comprises a hotel
    and the Airlangga Apartment respectively.  The hotel was opened in 2005.
- id: da8a48d05bc2
  source: hotpot:Oberoi family
  title: Oberoi family
  text: The Oberoi family is an Indian family that is famous for its involvement in
    hotels, namely through The Oberoi Group.
- id: 090cd8aa1b8f
  source: hotpot:Ishqbaaaz
  title: Ishqbaaaz
  text: 'Ishqbaaaz (English: "Lovers") is an Indian drama television series which
    is broadcast on Star Plus.  It premiered on 27 June 2016 and airs Mon-Fri 10-11pm
    IST. Nakuul Mehta, Kunal Jaisingh and Leenesh Mattoo respectively portray Shivaay,
    Omkara and Rudra, the three heirs of the Oberoi family.  The show initially focused
    on the tale of three brothers, later become centered on the love story of Shivaay
    and Annika (Surbhi Chandna); with the story of Omkara and Rudra being shifted
    to the spinoff series "Dil Boley Oberoi".  In July 2017 "Dil Boley Oberoi" ended
    and the storylines were merged back into "Ishqbaaaz" which doubled its runtime.'
- id: ca5db6b4b2cc
  source: hotpot:Hotel Tallcorn
  title: Hotel Tallcorn
  text: The Hotel Tallcorn is located in Marshalltown, Iowa.  Today it is called the
    Tallcorn Towers Apartments.  Built in 1928 by the Eppley Hotel Company, local
    citizens contributed $120,000 to ensure the successful completion of this seven-story
    hotel.  It was completed in connection to the seventy-fifth anniversary of Marshalltown.  The
    hotel's sale in 1956 from the Eppley chain to the Sheraton Corporation was part
    of the second largest hotel sale in United States history.  The Tallcorn was listed
    as a contributing property in the Marshalltown Downtown Historic District on the
    National Register of Historic Places in 2002.
- id: ea91a7dfe5cb
  source: hotpot:Mohan Singh Oberoi
  title: Mohan Singh Oberoi
  text: Rai Bahadur Mohan Singh Oberoi (15 August 1898 – 3 May 2002) was an Indian
    hotelier, the founder and chairman of Oberoi Hotels & Resorts, India's second-largest
    hotel company, with 35 hotels in India, Sri Lanka, Nepal, Egypt, Australia and
    Hungary.
- id: 9fa8e59a6a0f
  source: hotpot:Hotel Bond
  title: Hotel Bond
  text: 'Hotel Bond is a historic hotel, built in two stages in 1913 and 1921, in
    downtown Hartford, Connecticut by hotelier Harry S. Bond.  It is located near
    Bushnell Park, and was considered the grandest hotel in Hartford during its heyday.  The
    second section is a 12 story building attached to the 6 story first section.  A
    Statler Hotel opened in the area in 1954, creating competition, and the Bond Hotel
    company declared bankruptcy shortly after that.  It was bought by the California-based
    Masaglia Hotel chain, which began an incremental renovation program.  In 1964
    it was sold to a Cincinnati, Ohio investment group which announced extensive renovation
    plans.  However, the financing plans fell through and the hotel was again in bankruptcy.  The
    building was sold at auction to the Roman Catholic Archdiocese of Hartford in
    1965, and it became the home of the Saint Francis Hospital School of Nursing.  The
    Bond Ballroom reopened in 2001, with the rest of the building becoming a Homewood
    Suites '
- id: b7c4d7b81b8c
  source: hotpot:The Oberoi Group
  title: The Oberoi Group
  text: The Oberoi Group is a hotel company with its head office in Delhi.  Founded
    in 1934, the company owns and/or operates 30+ luxury hotels and two river cruise
    ships in six countries, primarily under its Oberoi Hotels & Resorts and Trident
    Hotels brands.
- id: d109c160b267
  source: hotpot:Future Fibre Technologies
  title: Future Fibre Technologies
  text: Future Fibre Technologies (FFT) is a fiber optic sensing technologies company
    based in Melbourne, Australia, with its US head office in Mountain View, California,
    Middle East head office in Dubai, Indian head office in New Delhi and European
    head office in London.  Founded in 1994, Future Fibre Technologies product line
    provides optical fiber intrusion detection systems for perimeters, buried oil
    and gas pipelines and data communication networks.
- id: 68236a00316e
  source: hotpot:289th Military Police Company
  title: 289th Military Police Company
  text: The 289th Military Police Company was activated on 1 November 1994 and attached
    to Hotel Company, 3rd Infantry (The Old Guard), Fort Myer, Virginia.  Hotel Company
    is the regiment's specialty company.
- id: 105f0442de41
  source: hotpot:Glennwanis Hotel
  title: Glennwanis Hotel
  text: The Glennwanis Hotel is a historic hotel in Glennville, Georgia, Tattnall
    County, Georgia, built on the site of the Hughes Hotel.  The hotel is located
    at 209-215 East Barnard Street.  The old Hughes Hotel was built out of Georgia
    pine circa 1905 and burned in 1920.  The Glennwanis was built in brick in 1926.  The
    local Kiwanis club led the effort to get the replacement hotel built, and organized
    a Glennville Hotel Company with directors being local business leaders.  The wife
    of a local doctor won a naming contest with the name "Glennwanis Hotel", a suggestion
    combining "Glennville" and "Kiwanis".
- id: 684d155fcdf8
  source: hotpot:Lisa Simpson
  title: Lisa Simpson
  text: Lisa Marie Simpson is a fictional character in the animated television series
    "The Simpsons".  She is the middle child and most intelligent of the Simpson family.  Voiced
    by Yeardley Smith, Lisa first appeared on television in "The Tracey Ullman Show"
    short "Good Night" on April 19, 1987.  Cartoonist Matt Groening created and designed
    her while waiting to meet James L. Brooks.  Groening had been invited to pitch
    a series of shorts based on his comic "Life in Hell", but instead decided to create
    a new set of characters.  He named the elder Simpson daughter after his younger
    sister Lisa Groening.  After appearing on "The Tracey Ullman Show" for three years,
    the Simpson family were moved to their own series on Fox, which debuted on December
    17, 1989.
- id: 3a742dcce6d2
  source: hotpot:Marge Simpson
  title: Marge Simpson
  text: Marjorie Jacqueline "Marge" Simpson (née Bouvier) is a fictional character
    in the American animated sitcom "The Simpsons" and part of the eponymous family.  She
    is voiced by Julie Kavner and first appeared on television in "The Tracey Ullman
    Show" short "Good Night" on April 19, 1987.  Marge was created and designed by
    cartoonist Matt Groening while he was waiting in the lobby of James L. Brooks'
    office.  Groening had been called to pitch a series of shorts based on "Life in
    Hell" but instead decided to create a new set of characters.  He named the character
    after his mother Margaret Groening.  After appearing on "The Tracey Ullman Show"
    for three seasons, the Simpson family received their own series on Fox, which
    debuted December 17, 1989.
- id: 0621e4ea680c
  source: hotpot:Bart Simpson
  title: Bart Simpson
  text: Bartholomew JoJo "Bart" Simpson is a fictional character in the American animated
    television series "The Simpsons" and part of the Simpson family.  He is voiced
    by Nancy Cartwright and first appeared on television in "The Tracey Ullman Show"
    short "Good Night" on April 19, 1987.  Cartoonist Matt Groening created and designed
    Bart while waiting in the lobby of James L. Brooks' office.  Groening had been
    called to pitch a series of shorts based on his comic strip, "Life in Hell", but
    instead decided to create a new set of characters.  While the rest of the characters
    were named after Groening's family members, Bart's name is an anagram of the word
    "brat".  After appearing on "The Tracey Ullman Show" for three years, the Simpson
    family received its own series on Fox, which debuted December 17, 1989.
- id: 00c4eb7489ab
  source: hotpot:Allie Goertz
  title: Allie Goertz
  text: Allison Beth "Allie" Goertz (born March 2, 1991) is an American musician.  Goertz
    is known for her satirical songs based on various pop culture topics.  Her videos
    are posted on YouTube under the name of Cossbysweater.  Subjects of her songs
    have included the film "The Room", the character Milhouse from the television
    show "The Simpsons", and the game Dungeons & Dragons.  Her style has been compared
    to that of Bo Burnham.  In December 2015, Goertz released a concept album based
    on the Adult Swim series "Rick and Morty", "Sad Dance Songs", with the album's
    cover emulating the animation and logo of the series.  The album was made possible
    through Kickstarter.  She is co-host of Everything's Coming Up Podcast, a Simpsons-focused
    podcast along with Julia Prescott.
- id: f4aa85531bf0
  source: hotpot:Milhouse Van Houten
  title: Milhouse Van Houten
  text: Milhouse Mussolini van Houten is a fictional character featured in the animated
    television series "The Simpsons", voiced by Pamela Hayden, and created by Matt
    Groening who named the character after President Richard Nixon's middle name.  Later
    in the series, it is revealed that Milhouse's middle name is "Mussolini."
- id: 388410847e4c
  source: hotpot:Los Angeles Reader
  title: Los Angeles Reader
  text: Los Angeles Reader was a weekly paper established in 1978 and distributed
    in Los Angeles, United States.  It followed the format of the (still active) Chicago
    Reader.  The paper was known for having lengthy, thoughtful reviews of movies,
    plays and concerts in the LA area.  James Vowell was its founding editor.  Among
    its writers were Keith Fitzgerald, Nigey Lennon, Lionel Rolfe, Lawrence Wechsler,
    Mick Farren, Richard Meltzer, Heidi Dvorak, Chris Morris, Jerry Stahl, Steven
    Kane, Andy Klein, Allen Levy, Jim Goad, Kirk Silsbee, Henry Sheehan, Samantha
    Dunn, Natalie Nichols, Steve Appleford, Eric Mankin (also editor), Paul Birchall,
    Eddie Rivera (who wrote the paper's first cover story), Amy Steinberg, Harry Sheehan,
    Dan Sallit, Myron Meisel, David Ehrenstein.  Tom Davis, Bruce Bebb, Stuart Goldman,
    Ernest Hardy, Kevin Uhrich, Erik Himmelsbach and David L. Ulin.  It is famous
    for being the first newspaper to publish Matt Groening's cartoon strip, Life in
    Hell on April 25, 1980.  James Vo
- id: 3eb871166288
  source: hotpot:Homer Simpson
  title: Homer Simpson
  text: Homer Jay Simpson is a fictional character and the main protagonist of the
    American animated television series "The Simpsons" as the patriarch of the eponymous
    family.  He is voiced by Dan Castellaneta and first appeared on television, along
    with the rest of his family, in "The Tracey Ullman Show" short "Good Night" on
    April 19, 1987.  Homer was created and designed by cartoonist Matt Groening while
    he was waiting in the lobby of James L. Brooks' office.  Groening had been called
    to pitch a series of shorts based on his comic strip "Life in Hell" but instead
    decided to create a new set of characters.  He named the character after his father,
    Homer Groening.  After appearing for three seasons on "The Tracey Ullman Show",
    the Simpson family got their own series on Fox that debuted December 17, 1989.
- id: 24645fa8b832
  source: hotpot:List of The Simpsons video games
  title: List of The Simpsons video games
  text: '"The Simpsons" is an American animated television sitcom created by Matt
    Groening for the Fox Broadcasting Company.  The series is a satirical parody of
    a middle class American lifestyle epitomized by its eponymous family, which consists
    of Homer, Marge, Bart, Lisa and Maggie.  It is set in the fictional town of Springfield,
    and lampoons American culture, society and television, and many aspects of the
    human condition.  The family was conceived by Groening shortly before a pitch
    for a series of animated shorts with producer James L. Brooks.  Groening created
    a dysfunctional family and named the characters after members of his own family,
    substituting Bart for his own name.  The shorts became a part of "The Tracey Ullman
    Show" on April 19, 1987 and after a three-season run, the sketch was developed
    into a half-hour prime time show and became a hit series for Fox.  The growing
    popularity of the series motivated video game developers to create video games
    based on the series.  Two pinball'
- id: faf9783a3945
  source: 'hotpot:The Simpsons: An Uncensored, Unauthorized History'
  title: 'The Simpsons: An Uncensored, Unauthorized History'
  text: 'The Simpsons: An Uncensored, Unauthorized History is a non-fiction book about
    the American animated television series "The Simpsons".  It was written by John
    Ortved, and first published in October 2009 by Faber and Faber.  In the United
    Kingdom, the book is called Simpsons Confidential: The uncensored, totally unauthorised
    history of the world''s greatest TV show by the people that made it.  The book
    is an oral history of the show, and concentrates particularly on the writers and
    producers of the show.  The book includes entire chapters devoted to key figures
    such as creator Matt Groening and James L. Brooks and Sam Simon, who helped develop
    the series.  According to National Public Radio reviewer Linda Holmes, "Ortved''s
    thesis, essentially, is that lots of people are responsible for the success of
    "The Simpsons", and their creator, Matt Groening, has too often been viewed as
    the sole source to the detriment of others who also deserve to be praised."'
- id: d50820278128
  source: hotpot:List of The Simpsons guest stars
  title: List of The Simpsons guest stars
  text: In addition to the show's regular cast of voice actors, celebrity guest stars
    have been a staple of "The Simpsons", an American animated television sitcom created
    by Matt Groening for the Fox Broadcasting Company, since its first season.  "The
    Simpsons" focuses on the eponymous family, which consists of Homer, Marge, Bart,
    Lisa and Maggie.  The family was initially conceived by Groening for a series
    of animated shorts, which originally aired as a part of "The Tracey Ullman Show"
    between 1987 and 1989.  The shorts were developed into a half-hour prime time
    series which began in December 1989.  The series' 27th season began in September
    2015 and episodes of "The Simpsons" have aired.  A feature film adaptation of
    the series called "The Simpsons Movie", was released in 2007.
- id: 389cce68daeb
  source: 'hotpot:Moloch: or, This Gentile World'
  title: 'Moloch: or, This Gentile World'
  text: 'Moloch: or, This Gentile World is a semi-autobiographical novel written by
    Henry Miller in 1927-28, initially under the guise of a novel written by his wife,
    June.  The book went unpublished until 1992, 65 years after it was written and
    12 years after Miller’s death.  It is widely considered to be of interest more
    as a study of Miller’s artistic growth than as a worthy piece of fiction.'
- id: 69fda46150a3
  source: hotpot:Launceston by-election, 1874
  title: Launceston by-election, 1874
  text: The Launceston by-election of 1874 was fought on 3 July 1874.  The byelection
    was fought due to the void Election of the incumbent Conservative MP, James Henry
    Deakin (senior).  It was won by the Conservative candidate James Henry Deakin
    (junior).
- id: a850ee7eac82
  source: 'hotpot:Incest: From a Journal of Love'
  title: 'Incest: From a Journal of Love'
  text: 'Incest: From a Journal of Love: The Unexpurgated Diary of Anaïs Nin (1932–1934)
    is a 1992 non-fiction book by Anaïs Nin.  It is a continuation of the diary entries
    first published in "Henry and June: From the Unexpurgated Diary of Anaïs Nin".  It
    features Nin''s relationships with writer Henry Miller, his wife June Miller,
    the psychoanalyst Otto Rank, her father Joaquín Nin, and her husband Hugh Parker
    Guiler.  She also copied some of her correspondence with these people into her
    diary.  Much of this book was written in English, although those of her letters
    which were originally written in French and Spanish were translated.  Most of
    this diary takes place in France, particularly Clichy, Paris and Louveciennes.'
- id: d8c2b69b9486
  source: hotpot:James Henry Deakin (junior)
  title: James Henry Deakin (junior)
  text: James Henry Deakin (1851 – 8 November 1881) was a British Conservative politician,
    the son of Col. James Henry Deakin, a Manchester merchant.
- id: 6b493b850163
  source: hotpot:Ewan MacColl
  title: Ewan MacColl
  text: James Henry Miller (25 January 1915 – 22 October 1989), better known by his
    stage name Ewan MacColl, was an English folk singer, songwriter, communist, labour
    activist, actor, poet, playwright and record producer.
- id: c873aff35336
  source: hotpot:Peggy Seeger
  title: Peggy Seeger
  text: Margaret "Peggy" Seeger (born June 17, 1935) is an American folksinger.  She
    is also well known in Britain, where she has lived for more than 30 years, and
    was married to the singer and songwriter Ewan MacColl until his death in 1989.
- id: f04b6d05985f
  source: hotpot:Henry Miller Memorial Library
  title: Henry Miller Memorial Library
  text: The Henry Miller Memorial Library is a nonprofit arts center, bookstore, and
    performance venue, championing the late writer, artist, and Big Sur resident Henry
    Miller, as well as many other, both living and dead, creative individuals living
    in or near Big Sur, California.  Henry Miller’s friend Emil White built the house
    that is now the Library in the mid-1960s.  After Miller died, in 1980, Emil decided
    to maintain his property as a memorial to his friend and as a gallery where local
    artists could show their work.  In 1981 Emil White, with the help of the Big Sur
    Land Trust, created "The Henry Miller Memorial Library, Founded by Emil White."
- id: d63679bbf37e
  source: hotpot:June Miller
  title: June Miller
  text: June Miller (January 7 or 28, 1902 – February 1, 1979) was the much-written-about
    second wife of Henry Miller.
- id: 9b1b86bb7a7b
  source: hotpot:James Innes-Ker, 7th Duke of Roxburghe
  title: James Innes-Ker, 7th Duke of Roxburghe
  text: James Henry Robert Innes-Ker, 7th Duke of Roxburghe (5 September 1839 – 23
    October 1892), became Duke of Roxburghe on the death of his father, James Henry
    Robert Innes-Ker, 6th Duke of Roxburghe.
- id: 8b2fd2ffdf5d
  source: hotpot:Jim Miller (Australian footballer, born 1919)
  title: Jim Miller (Australian footballer, born 1919)
  text: James Henry Miller (born 30 May 1919) is a former Australian rules footballer
    in the Victorian Football League (VFL).
- id: 9d8645162c10
  source: hotpot:Cadmium chloride
  title: Cadmium chloride
  text: Cadmium chloride is a white crystalline compound of cadmium and chlorine,
    with the formula CdCl.  It is a hygroscopic solid that is highly soluble in water
    and slightly soluble in alcohol.  Although it is considered to be ionic, it has
    considerable covalent character to its bonding.  The crystal structure of cadmium
    chloride (described below), composed of two-dimensional layers of ions, is a reference
    for describing other crystal structures.  Also known are CdCl•HO and CdCl•5HO.
- id: 612704134e35
  source: hotpot:Water blue
  title: Water blue
  text: Water blue, also known as aniline blue, Acid blue 22, Soluble Blue 3M, Marine
    Blue V, or C.I. 42755, is a chemical compound used as a stain in histology.  Water
    blue stains collagen blue in tissue sections.  It is soluble in water and slightly
    soluble in ethanol.
- id: 4131fc82afaa
  source: hotpot:Diflucortolone valerate
  title: Diflucortolone valerate
  text: Diflucortolone valerate (also "Nerisone" cream/oily cream/ointment, "Neriderm"
    ointment, Japanese ジフルコルトロン (Jifurucorutoron ) is a corticosteroid rated Class
    2 "potent" (100-150 times) in the New Zealand topical steroid system.  It is a
    white to creamy white crystalline powder.  It is practically insoluble in water,
    freely soluble in dichloromethane and in dioxan, sparingly soluble in ether and
    slightly soluble in methyl alcohol.  Chemically, it is a corticosteroid esterified
    with valeric acid.  It is commonly used topically in dermatology.  The brand name
    is Nerisone; its creams come in potencies of 0.1% and 0.3%.
- id: 47c272dd570c
  source: hotpot:Heptanoic acid
  title: Heptanoic acid
  text: Heptanoic acid, also called enanthic acid, is an organic compound composed
    of a seven-carbon chain terminating in a carboxylic acid.  It is an oily liquid
    with an unpleasant, rancid odor.  It contributes to the odor of some rancid oils.  It
    is slightly soluble in water, but very soluble in ethanol and ether.
- id: 610b3e96ccf6
  source: hotpot:Magnesium chloride
  title: Magnesium chloride
  text: Magnesium chloride is the name for the chemical compound with the formula
    MgCl and its various hydrates MgCl(HO).  These salts are typical ionic halides,
    being highly soluble in water.  The hydrated magnesium chloride can be extracted
    from brine or sea water.  In North America, magnesium chloride is produced primarily
    from Great Salt Lake brine.  It is extracted in a similar process from the Dead
    Sea in the Jordan valley.  Magnesium chloride, as the natural mineral bischofite,
    is also extracted (via solution mining) out of ancient seabeds; for example, the
    Zechstein seabed in northwest Europe.  Some magnesium chloride is made from solar
    evaporation of seawater.  Anhydrous magnesium chloride is the principal precursor
    to magnesium metal, which is produced on a large scale.  Hydrated magnesium chloride
    is the form most readily available.
- id: 62eb6bd6a1ed
  source: hotpot:Ethanol
  title: Ethanol
  text: Ethanol, also called alcohol, ethyl alcohol, and drinking alcohol, is a compound
    and simple alcohol with the chemical formula C2H5OH .  Its formula can be written
    also as CH3 −CH2 −OH or C2H5 −OH (an ethyl group linked to a hydroxyl group),
    and is often abbreviated as EtOH.  Ethanol is a volatile, flammable, colorless
    liquid with a slight characteristic odor.  It is used as a drug and is the principal
    type of alcohol found in alcoholic drinks.
- id: 549462e5a433
  source: hotpot:Tributyltin oxide
  title: Tributyltin oxide
  text: Tributyltin oxide (TBTO) is an organotin compound chiefly used as a biocide
    (fungicide and molluscicide), especially a wood preservative.  Its chemical formula
    is <ce>[(C4H9)3Sn]2O</ce>.  It has the form of a colorless to pale yellow liquid
    that is only slightly soluble in water (20 ppm) but highly soluble in organic
    solvents.  It is a potent skin irritant.
