  source: hotpot:Tinley Park station
  title: Tinley Park station
  text: Tinley Park Station (also known as Tinley Park-Oak Park Avenue Station) is
    an elaborate commuter railroad station along Metra's Rock Island District line
    in Tinley Park, Illinois.  The station is officially located at 6700 South Street
    between Oak Park Avenue and 66th Court, however parking is also available on the
    opposite side of the station along North Street between Oak Park Avenue and 67th
    Avenue, as well as the center of the block of Oak Park Avenue, 173rd Street, 67th
    Court and 172nd Street.  Another parking area exists along South Street opposite
    the main parking lot at the station.  The station itself is lies 23.5 mi away
    from LaSalle Street, the northern terminus of the line.
