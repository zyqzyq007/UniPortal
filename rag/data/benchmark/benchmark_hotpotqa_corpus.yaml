  source: hotpot:Leonid Bunimovich
  title: Leonid Bunimovich
  text: Leonid Bunimovich is a Soviet and American mathematician, who specializes
    in dynamical systems.  He is known for discovery of a fundamental mechanism of
    chaos (hyperbolicity) in Dynamical systems, which is called mechanism of defocusing.  The
    most famous class of chaotic dynamical systems of this type Dynamical billiards
    are focusing chaotic billiards (e.g., the "Bunimovich stadium","Bunimovich flowers",
    etc.).  More recently he introduced so called Bunimovich mushrooms, which are
    visual examples of billiards with mixed regular and chaotic dynamics.  In many
    labs over the world were built experimental devices in the form of various Bunimovich
    billiards.  He received bachelor's degree in 1967 and PhD in 1973 from the University
    of Moscow.  His thesis adviser was Yakov G. Sinai.  In 1986 he was awarded Doctor
    of Sciences degree in "Theoretical and Mathematical Physics".
