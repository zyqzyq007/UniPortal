  source: hotpot:Phantom Buffalo
  title: Phantom Buffalo
  text: Phantom Buffalo is an indie-rock band from Portland, Maine.  The band was
    known as The Ponys until 2004, when both Portland's Ponys and Chicago-based band
    The Ponys were invited to perform at South by Southwest.  Being the lower-profile
    of the two bands, the Portland group decided on a name change shortly thereafter.  The
    current lineup consists of Jonathan Balzano-Brookes (vocals, guitar), Tim Burns
    (guitar, vocals), Joe Domrad (drums), Jacob Chamberlain (drums), Sean Newton (bass),
    and Philip Willey (guitar, accordion, keyboards).  The band has released music
    domestically on the Time-Lag Records label and in the UK on Rough Trade Records.  The
    band's jangly, psychedelic pop music has been compared to The Byrds and New Zealand's
    The Chills, as well as North American indie-pop acts like The Shins and The New
    Pornographers.
