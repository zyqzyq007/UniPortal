    published in 1993 by St. Martin''s Press.  The book gives an account of Werner
    H. Erhard''s early life as Jack Rosenberg, his exploration of various forms of
    self-improvement techniques, and his foundation of Erhard Seminars Training "est"
    and later of Werner Erhard and Associates and of the Est successor course, "The
    Forum".  Pressman details the rapid financial success Erhard had with these companies,
