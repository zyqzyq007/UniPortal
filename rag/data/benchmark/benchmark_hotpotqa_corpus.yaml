  source: hotpot:Prosecution of gender-targeted crimes
  title: Prosecution of gender-targeted crimes
  text: Prosecution of gender-targeted crimes is the legal proceedings to prosecute
    crimes such as rape and domestic violence.  The earliest documented prosecution
    of gender-based/targeted crimes is from 1474 when Sir Peter von Hagenbach was
    convicted for rapes committed by his troops.  However, the trial was unsuccessful
    in indicting Sir von Hagenbach with the charge of rape because the war in which
    the rapes occurred was "undeclared" and thus the rapes were only considered illegal.  Gender-targeted
    crimes continued to be prosecuted, but it was not until after World War II when
    an international criminal tribunal- the International Military Tribunal for the
    Far East (Tokyo Tribunal)- were officers charged for being responsible of the
