  source: hotpot:Geography of India
  title: Geography of India
  text: India lies on the Indian Plate, the northern portion of the Indo-Australian
    Plate, whose continental crust forms the Indian subcontinent.  The country is
    situated north of the equator between 8°4' to 37°6' north latitude and 68°7' to
    97°25' east longitude.  It is the seventh-largest country in the world, with a
    total area of 3287263 km2 .  India measures 3214 km from north to south and 2933
    km from east to west.  It has a land frontier of 15200 km and a coastline of 7516.6
    km .
