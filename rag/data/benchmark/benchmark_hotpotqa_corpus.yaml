    and at weekends), and season 1 on music channel VIVA.
- id: 1a2946453fc5
  source: hotpot:Mount Panorama Circuit
  title: Mount Panorama Circuit
  text: Mount Panorama Circuit is a motor racing track located in Bathurst, New South
    Wales, Australia.  It is situated on a hill with the dual official names of Mount
    Panorama and Wahluu and is best known as the home of the Bathurst 1000 motor race
    held each October, and the Bathurst 12 Hour event held each February.  The 6.213
    km long track is technically a street circuit, and is a public road, with normal
    speed restrictions, when no racing events are being run, and there are many residences
    which can only be accessed from the circuit.
- id: 26e283e5c4f0
  source: hotpot:2016 Intercontinental GT Challenge
  title: 2016 Intercontinental GT Challenge
  text: The 2016 Intercontinental GT Challenge was the first season of the Intercontinental
    GT Challenge.  The season featured three rounds — after the cancellation of the
    6 Hours of the Americas - starting with Liqui Moly Bathurst 12 Hour on 7 February
    and the season concluded with the Sepang 12 Hours on 10 December.
- id: 3ab2a4dac906
  source: hotpot:Bathurst 12 Hour
  title: Bathurst 12 Hour
  text: The Bathurst 12 Hour (currently known as the Liqui Moly Bathurst 12 Hour for
    sponsorship reasons) is an endurance race for GT and production cars held at the
    Mount Panorama Circuit, in Bathurst, Australia in February each year.  The race
    was first held in 1991 for Series Production cars and moved to Sydney's Eastern
    Creek Raceway in 1995 before being discontinued.  The race was revived in 2007,
    again for production cars, before adding a new class for GT3 and other GT cars
    in 2011.  This has led to unprecedented domestic and international exposure for
    the event.  In all, sixteen races have taken place; fifteen at Mount Panorama
    and one at Eastern Creek Raceway.
- id: 000501a1a5c8
  source: hotpot:2018 Intercontinental GT Challenge
  title: 2018 Intercontinental GT Challenge
  text: The 2018 Intercontinental GT Challenge will be the third season of the Intercontinental
    GT Challenge.  The season will feature four rounds, starting with the Liqui Moly
    Bathurst 12 Hour on 4 February, and concluding with the California 8 Hours on
    21 October.
- id: 649f80268eb5
  source: hotpot:2016 Liqui Moly Bathurst 12 Hour
  title: 2016 Liqui Moly Bathurst 12 Hour
  text: 'The 2016 Liqui Moly Bathurst 12 Hour was an endurance race for a variety
    of GT and touring car classes, including: GT3 cars, GT4 cars and Group 3E Series
    Production Cars.  The event, which was staged at the Mount Panorama Circuit, near
    Bathurst, in New South Wales, Australia on 7 February 2016, was the fourteenth
    running of the Bathurst 12 Hour.  It was also the opening round of the 2016 Intercontinental
    GT Challenge Series.'
- id: a80f99595fba
  source: hotpot:2017 Intercontinental GT Challenge
  title: 2017 Intercontinental GT Challenge
  text: The 2017 Intercontinental GT Challenge will be the second season of the Intercontinental
    GT Challenge.  The season features four rounds, starting with the Liqui Moly Bathurst
    12 Hour on 5 February, and concluding with the Sepang 12 Hours on 10 December.  Laurens
    Vanthoor is the defending drivers' champion and Audi is the defending manufacturers'
    champion.
- id: 5af6ed7c36c1
  source: hotpot:2013 Liqui Moly Bathurst 12 Hour
  title: 2013 Liqui Moly Bathurst 12 Hour
  text: 'The 2013 Liqui Moly Bathurst 12 Hour was an endurance race for a variety
    of GT and touring car classes, including: GT3 cars, GT4 cars, Group 3E Series
    Production Cars and Dubai 24 Hour cars.  The event, which was staged at the Mount
    Panorama Circuit, near Bathurst, in New South Wales, Australia on 10 February
    2013, was the eleventh running of the Bathurst 12 Hour.  The race also incorporated
    the opening round of the 2013 Australian GT Championship.  The Australian GT Championship
    was to compete as the first hour only and cars were permitted to enter for only
    that hour or to cross-enter for both the first hour and continue for the endurance
    race.'
- id: 3a90caad02b4
  source: hotpot:2015 Liqui Moly Bathurst 12 Hour
  title: 2015 Liqui Moly Bathurst 12 Hour
  text: 'The 2015 Liqui Moly Bathurst 12 Hour was an endurance race for a variety
    of GT and touring car classes, including: GT3 cars, GT4 cars and Group 3E Series
    Production Cars.  The event, which was staged at the Mount Panorama Circuit, near
    Bathurst, in New South Wales, Australia on 8 February 2015, was the thirteenth
    running of the Bathurst 12 Hour.'
- id: 2f3ee2db4440
  source: hotpot:2017 Liqui Moly Bathurst 12 Hour
  title: 2017 Liqui Moly Bathurst 12 Hour
  text: The 2017 Liqui Moly Bathurst 12 Hour endurance race for GT and touring car
    classes, GT3 and GT4 cars was staged on the Mount Panorama Circuit, near Bathurst,
    in New South Wales, Australia 5 February 2017.  The 15th running of the Bathurst
    12 Hour constituted the opening round of the 2017 Intercontinental GT Challenge
    Series.  For the first time, the winners of the race were awarded the Australian
    Tourist Trophy.
- id: 29e618461b26
  source: hotpot:2014 Liqui Moly Bathurst 12 Hour
  title: 2014 Liqui Moly Bathurst 12 Hour
  text: 'The 2014 Liqui Moly Bathurst 12 Hour was an endurance race for a variety
    of GT and touring car classes, including: GT3 cars, GT4 cars and Group 3E Series
    Production Cars.  The event, which was staged at the Mount Panorama Circuit, near
    Bathurst, in New South Wales, Australia on 9 February 2014, was the twelfth running
    of the Bathurst 12 Hour.'
- id: fd382027bda8
  source: hotpot:Lights Out Paris
  title: Lights Out Paris
  text: Lights Out Paris is the first studio album by American hip hop artist Sims,
    a member of Minneapolis indie hip hop collective Doomtree.  It was released July
    28, 2005 on Doomtree Records and includes guest appearances from P.O.S, Crescent
    Moon, and Toki Wright, among others.  The album was re-released with four remixes
    and five songs from Sims' "False Hopes Four" on vinyl in June 2015.
- id: 7bb797399f55
  source: hotpot:El-P
  title: El-P
  text: Jaime Meline (born March 2, 1975), better known by his stage name El-P (shortened
    from El Producto), is an American hip hop recording artist, record producer, and
    record executive.  Originally a member of Company Flow, El-P has been a major
    driving force in alternative hip hop for more than two decades, producing for
    several notable rappers such as Aesop Rock, Mr. Lif, and Cage, among others.
- id: a6e22c935457
  source: hotpot:Born and Raised (EP)
  title: Born and Raised (EP)
  text: Born and Raised is the debut EP by American hip hop duo Smif-N-Wessun, released
    on December 3, 2013, under Duck Down Music Inc..  Entirely produced by Beatnick
    & K-Salaam, the 6-song EP is a blend between reggae and hip hop, and includes
    guest appearances from Junior Reid, Jr.  Kelly, Jahdan Blakkamoore, and DJ Full
    Factor.  The EP was preceded by one single — "Solid Ground" featuring dancehall
    icon Junior Reid.
- id: 19e47c6695eb
  source: hotpot:Lord Steppington
  title: Lord Steppington
  text: Lord Steppington is the debut studio album by California-based hip hop duo
    Step Brothers (rapper/producers The Alchemist and Evidence).  The album was released
    on January 21, 2014 by Rhymesayers Entertainment.  The record was produced entirely
    by Alchemist and Evidence, and includes guest appearances from Action Bronson,
    Roc Marciano, Blu, Fashawn, Rakaa, Oh No, Styles P, Domo Genesis and The Whooliganz
    – Alchemist's old group which included actor Scott Caan.
- id: 9a4323ff599b
  source: hotpot:Control Freek
  title: Control Freek
  text: Control Freek is the second solo effort by rapper Tash of the West Coast hip
    hop crew Tha Alkaholiks.  This albums comes ten years after Tash's first well-received
    solo album Rap Life.  It was released in 2009 on Amalgam Digital.  It includes
    guest appearances from Tash's group Tha Alkaholiks in addition to guest spots
    from Del the Funky Homosapien, King T, B-Real from Cypress Hill, Knoc-turn'al,
    Khujo from Goodie Mob, among others.
- id: 60726d499fef
  source: hotpot:Hip hop
  title: Hip hop
  text: 'Hip hop or hip-hop is a subculture and art movement developed in South Bronx
    in New York City during the late 1970s.  While people unfamiliar with hip hop
    culture often use the expression "hip hop" to refer exclusively to hip hop music
    (also called "rap"), Hip hop is characterized by nine distinct elements or expressive
    realms, of which hip hop music is only four elements (rapping, djaying, beatboxing
    and breaking).  Afrika Bambaataa of the hip hop collective Zulu Nation outlined
    the pillars of hip hop culture, coining the terms: "rapping" (also called MCing
    or emceeing), a rhythmic vocal rhyming style (orality); DJing (and turntablism),
    which is making music with record players and DJ mixers (aural/sound and music
    creation); b-boying/b-girling/breakdancing (movement/dance); and graffiti art,
    which he called "aerosol writin''", although many say that the graffiti that hip
    hop adopted had been around years earlier, and had nothing to do with hip hop
    culture.  (visual art).  Other element'
- id: 935815245eac
  source: hotpot:Fast Cars, Danger, Fire and Knives
  title: Fast Cars, Danger, Fire and Knives
  text: Fast Cars, Danger, Fire and Knives is an EP by American hip hop artist Aesop
    Rock.  Released via the Definitive Jux label on February 22, 2005, the record
    is produced by Blockhead and Aesop Rock himself, with the former producing three
    tracks and the latter producing four, with one track produced by Rob Sonic.  Vocals
    are handled by Aesop Rock, with guest appearances from Camu Tao and Metro of S.A.
    Smash and Definitive Jux label head El-P.  All scratches are performed by DJ Big
    Wiz.
- id: 78653e0ddfad
  source: hotpot:Longterm Mentality
  title: Longterm Mentality
  text: Longterm Mentality is the debut studio album by American hip hop recording
    artist Ab-Soul.  It was released on April 5, 2011, by Top Dawg Entertainment (TDE),
    exclusively to digital retailers, serving as Ab-Soul's debut retail release.  The
    album features guest appearances from Jhené Aiko, Schoolboy Q, Kendrick Lamar,
    Punch, Alori Joh, JaVonté, MURS, BJ the Chicago Kid and Pat Brown, with the production
    from American hip hop record producers such as Tae Beast, Ayiro, Sounwave, AAyhasis,
    Context, Alexis Carrington and Tommy Black.  Upon its release, the album received
    a highly acclaimed by music critics.
- id: 7a596e72f0ee
  source: hotpot:Experimental hip hop
  title: Experimental hip hop
  text: Experimental hip hop, also known as abstract hip hop, is a genre of hip hop
    that employs structural elements typically considered unconventional in traditional
    hip hop music.  Some notable experimental hip hop record labels include Definitive
    Jux, Anticon, Big Dada and Ninja Tune.  While most experimental hip hop incorporates
    turntablism and is produced electronically, some artists have introduced acoustic
    elements to the music to facilitate it being performed live.
- id: 47e07e8f65ed
  source: hotpot:Changes (Alyson Avenue album)
  title: Changes (Alyson Avenue album)
  text: Changes is the third album by Swedish AOR/rock band Alyson Avenue with new
    vocalist Arabella Vitanc.  Alyson Avenue released their third album "Changes"
    through Avenue of Allies.  The record was co-produced by band members and Chris
    Laney (Crazy Lixx, H.E.A.T., Brian Robertson) and includes guest appearances by
    Anette Olzon (Ex-Nightwish, Ex-Alyson Avenue), Michael Bormann (Ex-Jaded Heart,
    Charade, BISS), Rob Marcello (Danger Danger, Marcello - Vestry), Fredrik Bergh,
    (Street Talk, Bloodbound), Tommy Stråhle and Mike Andersson (Cloudscape, Planet
    Alliance).
- id: e93ac6f70ee7
  source: hotpot:Louis Stevens (writer)
  title: Louis Stevens (writer)
  text: 'Louis Stevens (December 25, 1896 – September 29, 1963) was an American screenwriter
    of the silent and sound film eras.  Born on Christmas Day 1896 in Riga, Latvia,
    Stevens entered the film industry in 1920 when he co-wrote the silent film "A
    World of Folly", with Jane Grogan.  In his over 30-year career he worked on over
    40 screenplays, as well as several film shorts and two television series.  Among
    his more notable films were: contributing to the script of the 1931 version of
    "Dracula", starring Bela Lugosi; co-writing the story for What Price Hollywood?  (1932);
    the screenplay for the 1940 western, "Colorado", directed by Joseph Kane, and
    starring Roy Rogers; the story for "Streets of Laredo" (1949), starring William
    Holden, Macdonald Carey and William Bendix; 1951''s "The Cimarron Kid", starring
    Audie Murphy; and "Horizons West" (1952), starring Robert Ryan, Julie Adams, and
    Rock Hudson.  Stevens'' final screenplay was for "Flaming Frontier" in 1958, although
    he did some work on addi'
- id: 7ce575c5c01e
  source: hotpot:The Lone Gunmen
  title: The Lone Gunmen
  text: The Lone Gunmen are a trio of fictional characters, Richard "Ringo" Langly,
    Melvin Frohike and John Fitzgerald Byers, who appeared in recurring roles on the
    American television series "The X-Files", and who starred in the short-lived spin-off,
    "The Lone Gunmen".  Their name was derived from the Warren Commission's conclusion
    that Lee Harvey Oswald was solely responsible for the assassination of John F.
    Kennedy.
- id: 5eb98d0ad1bc
  source: hotpot:Hermanos de Pistoleros Latinos
  title: Hermanos de Pistoleros Latinos
  text: Hermandad de Pistoleros Latinos (HPL, a.k.a. Pistoleros Latinos or Cuetes)
    is a Latino prison gang founded by Chino Avitia in Texas during the early 1980s.  The
    English translation of the gang's name is "Brotherhood of Latin Gunmen".  It operates
    in all Texas prisons and on the streets in many communities in Texas, particularly
    in Laredo.  HPL is active throughout Mexico with its largest contingent in Nuevo
    Laredo.  The gang is structured and is estimated to have 1,000 members.  Members
    maintain close ties to several Mexican drug trafficking organizations and are
    involved in the trafficking of large quantities of cocaine and marijuana from
    Mexico into the United States for distribution.
- id: e9405caf073d
  source: hotpot:Piranha (1972 film)
  title: Piranha (1972 film)
  text: Piranha, also known as Piranha, Piranha or Caribe, is a 1972 adventure film
    shot in Venezuela starring William Smith and Peter Brown who had previously starred
    together in the "Laredo" Western TV series and Ahna Capri.
- id: 71649f71768c
  source: hotpot:Gunmen from Laredo
  title: Gunmen from Laredo
  text: Gunmen from Laredo is a 1959 American western film produced and directed by
    Wallace MacDonald, which stars Robert Knapp, Maureen Hingert, and Walter Coy.
- id: 1b87f86e53ea
  source: hotpot:Seemanto-heera
  title: Seemanto-heera
  text: Sheemanto heera (The Frontier Diamond) is a detective novella written in Bengali
    by Sharadindu Bandyopadhyay featuring the sleuth Byomkesh Bakshi and Ajit Bandyopadhyay.  Written
    in 1934, it is the third such work of fiction featuring Byomkesh and is written
    in first-person narrative, as experienced by Byomkesh's friend, associate, and
    narrator, Ajit Bandyopadhyay.
- id: d9bd7743ec6c
  source: hotpot:Frontier Texas!
  title: Frontier Texas!
  text: Frontier Texas!  is a 14000 sqft museum of the American West in downtown Abilene,
    the seat of Taylor County in West Texas.  The museum serves as a visitors information
    center for the Texas Forts Trail, one of ten Texas Historical Commission driving
    regions.  Opened in 2004 at 625 North First Street on 6.4 acre near the Texas
    and Pacific Railway tracks, the museum focuses on settlers and lifestyles in the
    Old West.  Exhibits display attacks by Indians and wolves, stampeding buffalo,
    a card game shootout, and a prairie thunderstorm.  Visitors see depictions of
    buffalo hunters, Comanche warriors, explorers, and pioneers in the theatre called
    the "Century of Adventure", 1780-1880.  The narrator in the theater is actor-artist
    Buck Taylor from Fort Worth.
- id: 36229031e65f
  source: hotpot:Walter Coy
  title: Walter Coy
  text: Walter Darwin Coy (January 31, 1909 – December 11, 1974) was an American stage,
    radio, film, and, principally, television actor, originally from Great Falls,
    Montana.  He was best known for narrating the NBC western anthology series, "Frontier",
    which aired early Sunday evenings in the 1955–1956 season.
- id: 535e10c842f9
  source: hotpot:Max McLean
  title: Max McLean
  text: 'Max McLean is the founder and artistic director of Fellowship for Performing
    Arts, a New York City-based producer of live theater from a Christian worldview.  McLean
    conceived, adapted, produced and starred in "The Screwtape Letters", a play based
    on the book by Oxford and Cambridge scholar, author and fantasy writer C.S. Lewis.  His
    stage adaptation of Lewis’ "The Great Divorce" launched its national tour in late
    2013.  McLean adapted, co-directed and starred in "C.S. Lewis Onstage: The Most
    Reluctant Convert", and co-wrote and produced "Martin Luther on Trial".  McLean
    also is the narrator of The Listener''s Bible.'
- id: 8e611c87a9ba
  source: hotpot:Bruce Harwood
  title: Bruce Harwood
  text: Bruce Harwood (born April 29, 1963) is a Canadian character actor best known
    for his role of John Fitzgerald Byers, one of The Lone Gunmen on the television
    series "The X-Files".  In addition to "The X-Files", Harwood portrayed Byers in
    the spin-off series "The Lone Gunmen", which aired thirteen episodes in 2001.  He
    has also played other roles with a strong similarity to Byers, such as Willis,
    a technician from the Phoenix Foundation in "MacGyver", and government-scientist-turned-conspiracy-theorist
    Dr. Avery Strong in "The Outer Limits".  He was a founding member of the Vancouver
    summer Shakespeare festival, Bard on the Beach.  He also starred in the 1988 movie
    "Earth Star Voyager".
- id: 105a10e94a34
  source: hotpot:Pantun Sunda
  title: Pantun Sunda
  text: 'Pantun Sunda is a type of Sundanese oral narrative performance interspersed
    with songs and music played on a "kacapi", a kind of zither.  A pantun is intended
    to be recited during an evening-length performance during which a single performer
    relates the story of a hero’s initiation: The protagonist leaves his kingdom in
    order to seek experiences, beautiful princesses to become his wife, power, other
    kingdoms to subject, the realization of a dream (Rosidi 1984a:143); after having
    succeeded in reaching his goal he finally returns to his kingdom.  Alongside descriptions
    of historical events, the stories often contain mythical elements.  Pantun were
    originally not written down, the bards often being illiterate and in many cases
    blind.  Originally the performances had a sacred character, as was clear from
    the offerings made at the beginning of the recitation and also from the content
    of the introductory part of the story, called rajah, which was an invocatory song,
    imploring the help of div'
- id: 1fd3a737fee1
  source: hotpot:Bubu music
  title: Bubu music
  text: Bubu music is traditional music played by the Temne people in Sierra Leone.  The
    music was originally used in witchcraft ceremonies, but later it turned into a
    popular religious processional style played during Ramadan.  In its folk form,
    the music is played by blowing on bamboo cane flutes and on metal pipes -often
    repurposed auto parts.
- id: 111a404766d9
  source: hotpot:Peşrev
  title: Peşrev
  text: Peşrev (pronounced ] in Turkish), "Pişrev" ([piʃˈɾev] ), "peshrev," or "pishrev;"
    called "bashraf" بشرف in Arabic; is an instrumental form in Turkish classical
    music.  It is the name of the first piece of music played during a group performance
    called a fasıl (] ).  It also serves as the penultimate piece of the "Mevlevi
    ayini", ritual music of the Mevlevi order, under the name "son peşrev" (final
    peşrev), preceding "son semai".  It usually uses long rhythm cycles, stretching
    over many measures as opposed to the simpler usul the other major form of instrumental
    music uses, "saz semai".
- id: 52bd53e58d99
  source: hotpot:Skiffle
  title: Skiffle
  text: Skiffle is a music genre with jazz, blues, folk and American folk influences,
    usually using a combination of manufactured and homemade or improvised instruments.  Originating
    as a term in the United States in the first half of the 20th century, it became
    popular again in the UK in the 1950s, where it was associated with artists such
    as Lonnie Donegan, The Vipers Skiffle Group, Ken Colyer and Chas McDevitt.  Skiffle
    played a major part in beginning the careers of later eminent jazz, pop, blues,
    folk and rock musicians and has been seen as a critical stepping stone to the
    second British folk revival, blues boom and British Invasion of the US popular
    music scene.
- id: b88fe6686bbb
  source: hotpot:Cachi Cachi music
  title: Cachi Cachi music
  text: Cachi Cachi music, also spelled Kachi Kachi, Kachi-Kachi and Katchi-Katchi,
    is a term that was coined to refer to music played by Puerto Ricans in Hawaii,
    when they migrated to Hawaii.  It is a "variation of dance music found in Hawaii".  Sometimes
    cachi cachi "involves fast, improvised solos" on the guitar.  The "influence on
    Hawai'i endures to this day in the musical form known as "cachi cachi" played
    on the quarto [sic] and derivative of the Puerto Rican jibaro style."  "Jibaro"
    means peasant in Spanish.
- id: ca673db5d5d7
  source: hotpot:Background music
  title: Background music
  text: Background music refers to various styles of music or soundscapes primarily
    intended to be passively listened to.  It is not meant to be the main focus of
    an audience, but rather to supplement that which is meant to be focused upon.  Music
    that is played at a low volume and is not the main focus of an audience is also
    referred to as background music.  Traditional examples of background music include
    music played at various social gatherings and music played in certain retail venues.  It
    is also common to employ background music in various electronic media including
    film, television, video games, and Internet videos such as video blogs.
- id: 639a2a0e062e
  source: hotpot:Kantrum
  title: Kantrum
  text: Kantrum (Thai กันตรึม) is a type of folk music played by the Khmer in Isan,
    Thailand, living near the border with Cambodia.  It is a fast, traditional dance
    music.  In its purest form, cho-kantrum, singers, percussion and fiddles dominate
    the sound.  A more modern form using electric instrumentation arose in the mid-1980s.
- id: 4c45e511e60a
  source: hotpot:Chillador
  title: Chillador
  text: A chillador is a very small guitar-shaped fretted stringed instrument, usually
    with 10, 12, or 14 metal strings, in paired or tripled courses.It is played in
    Peru and in some border areas in Bolivia, usually has 5 courses like its cousin,
    the charango.  The sort of music played on chillador it is very much like the
    music played on charango.  The main difference between charango and chillador
    is that the charango soundbox is made of an armadillo shell while the chillador
    is just a little guitar.
- id: 9a9209b97705
  source: hotpot:Die Rhöner Säuwäntzt
  title: Die Rhöner Säuwäntzt
  text: Die Rhöner Säuwäntzt are a Skiffle-Bluesband from Eichenzell-Lütter in Hessen,
    Germany.  The line-up consists of Martin Caba, Christoph Günther and Christoph
    Leipold playing Skiffle-Blues with lyrics based on Rhön Mountains dialect and
    other Hessian dialects varieties.  The expression "Säuwäntzt" means pork belly
    and refers also to untidy or unruly children and youth.
- id: 29816b031687
  source: hotpot:Minoru Kojima
  title: Minoru Kojima
  text: Minoru Kojima (born 11 October 1968) was the original guitarist for Japanese
    experimental punk band The Mad Capsule Markets.  He is also known as Scene or
    Shin Murohime, which is apparently a conglomeration of characters from the names
    of different Boøwy members.  He started The Mad Capsule Markets (which at the
    time was called Berrie) in 1985, with vocalist Hiroshi Kyono, in an attempt to
    create "loud, punk music" after becoming "bored" with music played on television
    and radio.  After the release of Mad's Noël Coward "Humanity", Minoru left the
    band and was replaced by "support guitarist" Ai Ishigaki.  In 1991 Minoru started
    Die in Cries and in 1994 became a member of The Bloody Imitation Society.  Over
    the years Minoru worked with more bands and even went solo for a short time before
    returning to Mad to play on "Good Day" from their album "010" and playing on their
    "Cistm Konfliqt" tour.
- id: 83f2e0170774
  source: hotpot:Winston Lagoon
  title: Winston Lagoon
  text: Winston Lagoon ( ) is a lagoon indenting the southeast coast of Heard Island
    in the southern Indian Ocean, about 1 nautical mile (1.9 km) northeast of Cape
    Lockyer.  The feature is roughly portrayed on an American sealer chart of the
    1860 period.  It was sighted from the air by Lieutenant Malcolm Smith, RAAF, pilot
    of the ANARE (Australian National Antarctic Research Expeditions) seaplane that
    made the first reconnaissance flight over the island in 1948.  Lieutenant Smith
    proposed that it be named Lake Winston after his wife.  In view of his death in
    an aircraft accident shortly afterward, this proposal was adopted by Australian
    Antarctic Names and Medals Committee (ANCA) with only a change of generic term.  Click
    here to see a map of Heard Island and McDonald Islands, including all major topographical
    features.
- id: a02833e673c1
  source: hotpot:Malcolm Smith (American football)
  title: Malcolm Smith (American football)
  text: Malcolm Xavier Smith (born July 5, 1989) is an American football linebacker
    for the San Francisco 49ers of the National Football League (NFL).  Smith played
    college football at USC.  He was drafted by the Seattle Seahawks in the seventh
    round of the 2011 NFL Draft.  Smith was named the Most Valuable Player of Super
    Bowl XLVIII after they defeated the Denver Broncos.
- id: 6ce6543bc279
  source: hotpot:Super Bowl XLVIII
  title: Super Bowl XLVIII
  text: Super Bowl XLVIII was an American football game between the American Football
    Conference (AFC) champion Denver Broncos and National Football Conference (NFC)
    champion Seattle Seahawks to decide the National Football League (NFL) champion
    for the 2013 season.  The Seahawks defeated the Broncos 43–8, the largest margin
    of victory for an underdog and tied for the third largest point differential overall
    (35) in Super Bowl history with Super Bowl XXVII (1993).  It was the first time
    the winning team scored over 40 points, while holding their opponent to under
    10.  This became the first Super Bowl victory for the Seahawks and the fifth Super
    Bowl loss for the Broncos, the most of any team.  The game was played on February
    2, 2014, at MetLife Stadium at the Meadowlands Sports Complex in East Rutherford,
    New Jersey, the first Super Bowl played outdoors in a cold-weather city and the
    first Super Bowl to be played on a February 2.
- id: 36323feda3e1
  source: hotpot:2013 NBA Summer League
  title: 2013 NBA Summer League
  text: The 2013 NBA Summer League is a pro basketball league run by the NBA just
    after the 2013 NBA draft.  It gives newly drafted players a chance to test their
    skills against each other, and to give them a feel for professional basketball.  All
    30 NBA teams participated, along with the D-League Select.  The Miami Heat were
    the only team to participate in both Summer Leagues.  It ran from July 7–12 in
    Orlando and July 12–22 in Las Vegas.  Jeremy Lamb of the Oklahoma City Thunder
    was named the Most Valuable Player of the Orlando Summer League.  Jonas Valančiūnas
    of the Toronto Raptors went on to be named the Most Valuable Player of the Las
    Vegas Summer League.  Ian Clark of the Golden State Warriors was named the Most
    Valuable Player of the Las Vegas Summer League Championship Game.
- id: 0905f16a5874
  source: hotpot:Steve Clark (American football)
  title: Steve Clark (American football)
  text: Stephen Spence Clark (born August 2, 1960) is a former professional American
    football player who played [[defensive tackle]and offensive guard ] for five seasons
    for the [[Miami Dolphins]].  He also played on two state championship teams in
    high school which were a combined (25-1) over two years and was a five team all-American
    including "Parade Magazine", he was also named Most Valuable Player of the state
    of Utah.  At the University of Utah he was named two time All-WAC defensive tackle,
    Defensive Most Valuable Player of the Western Athletic Conference and First Team
    All-American.  He also played in the East-West Shrine Game and was named MVP of
    the Senior Bowl.  After the Senior Bowl he was drafted by Don Shula and The Miami
    Dolphins, his second year in the NFL he played both ways in a pre-season game
    and Coach Shula knew he had a guy that could back up every position on the offensive
    and defensive line as well as long snap.  He earned a starting position at right
    guard and played a
- id: 5759f4089ffa
  source: hotpot:1959 Illinois Fighting Illini football team
  title: 1959 Illinois Fighting Illini football team
  text: The 1959 Illinois Fighting Illini football team was an American football team
    that represented the University of Illinois during the 1959 Big Ten Conference
    football season.  In their 18th year under head coach Ray Eliot, the Illini compiled
    a 5–3–1 record and finished in a tie for third place in the Big Ten Conference.  After
    the season, guard Bill Burrell was selected as the team's most valuable player
    and also received the Chicago Tribune Silver Football trophy as the Big Ten's
    most valuable player.
- id: adea8547082d
  source: hotpot:103rd Grey Cup
  title: 103rd Grey Cup
  text: The 103rd Grey Cup was a Canadian football game that was played on November
    29, 2015 between the East Division champion Ottawa Redblacks and the West Division
    champion Edmonton Eskimos to decide the Canadian Football League (CFL) championship
    for the 2015 season.  The game was played at Investors Group Field in Winnipeg,
    Manitoba.  Shaw Communications was the presenting sponsor of the game; it was
    the first time in CFL history that the Grey Cup has been sponsored.  The Eskimos
    won the contest 26–20 to claim their 14th Grey Cup championship in franchise history
    and first since 2005.  Mike Reilly was named Most Valuable Player and Shamawd
    Chambers received the Dick Suderman Trophy as Most Valuable Canadian.
- id: b156823104fc
  source: hotpot:Richard Smith (rugby union, born 1973)
  title: Richard Smith (rugby union, born 1973)
  text: Richard Malcolm Smith (born 6 June 1973) is a former rugby union player who
    played scrum-half for Ebbw Vale RFC, Sale Sharks, Worcester Warriors, Newport
    RFC, Bristol Rugby, Cardiff RFC, Newbridge RFC, Merthyr RFC and Cardiff Blues.  He
    was a regular in the Wales 22 but only gained one Wales cap as he was being overlooked
    for Robert Howley and Rupert Moon.  He is well known for using the box kick to
    relieve the pressure posed by the opposition and to also gain territory.  He was
    a very skilful, technical and intelligent rugby player with excellent game management.
- id: 6113c7857dbc
  source: hotpot:Kevin Durant
  title: Kevin Durant
  text: Kevin Wayne Durant (born September 29, 1988) is an American professional basketball
    player for the Golden State Warriors of the National Basketball Association (NBA).  He
    has won an NBA championship, an NBA Most Valuable Player Award, the Bill Russell
    NBA Finals Most Valuable Player Award, the NBA All-Star Game Most Valuable Player
    Award, four NBA scoring titles, the NBA Rookie of the Year Award, and two Olympic
    gold medals.  Durant has also been selected to seven All-NBA teams and eight NBA
    All-Star teams.
- id: cc92cf01a73b
  source: hotpot:Super Bowl Most Valuable Player Award
  title: Super Bowl Most Valuable Player Award
  text: The Super Bowl Most Valuable Player Award, or Super Bowl MVP, is presented
    annually to the most valuable player of the Super Bowl, the National Football
    League's (NFL) championship game.  The winner is chosen by a fan vote during the
    game and by a panel of 16 football writers and broadcasters who vote after the
    game.  The media panel's ballots count for 80 percent of the vote tally, while
    the viewers' ballots make up the other 20 percent.  The game's viewing audience
    can vote on the Internet or by using cellular phones; Super Bowl XXXV, held in
    2001, was the first Super Bowl with fan voting.
- id: 4714ce07764c
  source: hotpot:Zilpo Road
  title: Zilpo Road
  text: Zilpo Road is a National Forest Scenic Byway in the forested hills of eastern
    Kentucky, United States.  The nine mile byway starts south of Morehead, Kentucky
    and can be accessed by U.S. Highway 60.  The byway travels through the Daniel
    Boone National Forest and ends on the western shore of Cave Run Lake at the Zilpo
    Recreation Area.  It follows FSR 918, which is a two lane paved road suitable
    for all motor vehicles and is usually open throughout the year.
- id: c03c047178e2
  source: hotpot:RISE (sculpture)
  title: RISE (sculpture)
  text: RISE is a concept £400,000 public art spherical metal sculpture in Belfast
    by Wolfgang Buttress.  It is 37.5 m high and 30 m wide and was constructed in
    early 2011 in the centre of the Broadway roundabout, at the junction of the Westlink
    and M1 motorway, a main gateway to the city where (as of 2009) more than 80,000
    cars on average flow past it each day.  It is informally known as The Balls on
    the Falls as this junction also gives access to the Falls Road area via Broadway.
- id: 5388cf512178
  source: hotpot:Peterman Hill
  title: Peterman Hill
  text: Peterman Hill is an unincorporated community located on a high ridge in Boyd
    County, Kentucky, on the Catlettsburg-Cannonsburg Pike (the Cannonsburg Road),
    three miles (5 km) west of Catlettsburg.  The road was originally known as Midland
    Trail and later U.S. 60 alternate until 1964 when it reverted to county maintenance.  It
    is now State Route 3294.
- id: 1f88a35bc077
  source: hotpot:Arkansas Highway 113
  title: Arkansas Highway 113
  text: Arkansas Highway 113 (AR 113 and Hwy.  113) is a north–south state highway
    that runs in Central Arkansas.  The route runs 29.48 mi from Arkansas Highway
    10 to Morrilton.  This also gives access to some rural areas west of Morrilton.  It
    runs through Pulaski, Perry, and Conway Counties.  It contains no spur of business
    routes.
- id: b5d5a8686fd8
  source: hotpot:California State Route 266
  title: California State Route 266
  text: State Route 266 (SR 266) is a state highway in the U.S. state of California.  The
    route traverses Fish Lake Valley, which is part in California and part in Nevada.  The
    route connects two Nevada state routes that traverse the Nevada portion of the
    valley, NV 264 and NV 266.  The only connection from SR 266 to the rest of California's
    road network is via SR 168.  Prior to 1986 the southern and northern halves of
    modern SR 266 had separate numerical designations.  The southern portion of the
    highway, along with modern SR 168, dates to the auto trail era, forming part of
    the Midland Trail.
- id: 881767c85d6f
  source: hotpot:Morehead, Kentucky
  title: Morehead, Kentucky
  text: Morehead is a home rule-class city located along US 60 (the historic Midland
    Trail) and Interstate 64 in Rowan County, Kentucky, in the United States.  It
    is the seat of its county.  The population was 6,845 at the time of the 2010 U.S.
    census.
- id: 7f73a6418464
  source: hotpot:Roman bridge of Salamanca
  title: Roman bridge of Salamanca
  text: 'The Roman bridge of Salamanca (in Spanish: "Puente romano de Salamanca"),
    also known as Puente Mayor del Tormes is a Roman bridge crossing the Tormes River
    on the banks of the city of Salamanca, in Castile and León, Spain.  The importance
    of the bridge as a symbol of the city can be seen in the first quartering of city''s
    coat of arms (along with its stone bull-verraco.)  Has been known traditionally
    as "puente mayor" and as "puente prinçipal" (main bridge) which gives access to
    the southern part of the city.  The bridge is presented in the 21st century as
    a result of several restorations.  One of the disasters that most affected it
    was the Flood of San Policarpo (January 26''s night) of year 1626.  It is declared
    Artistic Historic Monument on June 3, 1931, and Bien de Interés Cultural since
    1998.  Until the beginning of 20th century it did not lose its status as the single
    point of access to the city, and for many years continued to bear heavy traffic.  From
    the construction of a third '
- id: 24c00e85d8a8
  source: hotpot:Hawks Nest, West Virginia
  title: Hawks Nest, West Virginia
  text: Hawk's Nest, the site of Hawks Nest State Park, is a peak on Gauley Mountain
    in Ansted, West Virginia, USA.  The cliffs at this point rise 585 ft (178 m) above
    the New River.  Located on the James River and Kanawha Turnpike (the road that
    served as an extension of the canal across what is now West Virginia), many early
    travelers on this road stopped to see the view of the river below.  In modern
    times, the Midland Trail carries U.S. Route 60 through the same general route.  Ample
    parking at the overlook in the state park provides tourists with free access to
    the views.
- id: 4c1d7f6612f1
  source: hotpot:Hawaii Route 64
  title: Hawaii Route 64
  text: Route 64 is a three-mile (5 km) road that stretches from Nimitz Highway (Hawaii
    Route 92) to the entrance of Sand Island State Recreation Area just west of downtown
    Honolulu.  The route also goes by the street name as Sand Island Parkway.  The
    route gives access to Sand Island State Recreation Area and the U.S. Coast Guard
    Honolulu Branch by crossing the Kapalama Channel.
- id: b0eaf107fa66
  source: hotpot:Glen Ferris, West Virginia
  title: Glen Ferris, West Virginia
  text: Glen Ferris is a census-designated place (CDP) on the western bank of the
    Kanawha River in Fayette County, West Virginia.  It is situated approximately
    one mile south of the town of Gauley Bridge.  The sole highway linking Glen Ferris
    to the area is U.S. Route 60, known also as the Midland Trail.  As of the 2010
    census, its population was 203; the community had 104 housing units, 87 of which
    were occupied.  The village is roughly a mile and a half in length.  Glen Ferris
    is home to two churches, one Apostolic and one Methodist.  A railway owned by
    Norfolk Southern runs parallel to US Route 60 through the village.
- id: 2a060f0514e5
  source: hotpot:Shane Stanley
  title: Shane Stanley
  text: Shane Stanley (born June 15, 1971 in Los Angeles) is a multi-Emmy Award-winning
    filmmaker and founder of Visual Arts Entertainment, a film and television production
    company based in Los Angeles.  Best known for executive producing "Gridiron Gang"
    starring Dwayne "The Rock" Johnson for Sony Pictures and directing Bret Michaels
    music videos supporting the hit show "Rock of Love".  Stanley, a four-time nominee,
    was the youngest to ever win a production Emmy Award, winning his first at sixteen
    and his second at nineteen for his work on The Desperate Passage Series.  Stanley
    made his directorial debut helming his own screenplay "A Sight for Sore Eyes"
    which starred Academy Award nominee Gary Busey.  Besides being honored with dozens
    of prestigious awards and film festival honors, the film was invited to screen
    at the Cannes Film Festival in 2005 and won Best Drama at the International Family
    Film Festival in 2006.
- id: df423009d0cd
  source: hotpot:Robert Cummings
  title: Robert Cummings
  text: Charles Clarence Robert Orville Cummings, known as Bob Cummings (June 9, 1910
    – December 2, 1990), was an American film and television actor known mainly for
    his roles in comedy films such as "The Devil and Miss Jones" (1941) and "Princess
    O'Rourke" (1943), but was also effective in dramatic films, especially two of
    Alfred Hitchcock's thrillers, "Saboteur" (1942) and "Dial M for Murder" (1954).  Cummings
    received five Primetime Emmy Award nominations, and won the Primetime Emmy Award
    for Best Actor in a Single Performance in 1955.  On February 8, 1960, he received
    two stars on the Hollywood Walk of Fame for his contributions to the motion picture
    and television industries.  The motion picture star is at 6816 Hollywood Boulevard,
    the television star is on 1718 Vine Street.
- id: 12517653a22d
  source: hotpot:Beau Bridges
  title: Beau Bridges
  text: Lloyd Vernet "Beau" Bridges III (born December 9, 1941) is an American actor
    and director.  He is a three-time Emmy, two-time Golden Globe and one-time Grammy
    Award winner.  He is also a two-time Screen Actors Guild Award nominee.  Bridges
    was awarded a star on the Hollywood Walk of Fame on April 7, 2003 at 7065 Hollywood
    Boulevard for his contributions to the television industry.  He is the son of
    actor Lloyd Bridges and elder brother of fellow actor Jeff Bridges.
- id: 9d752ca5fd24
  source: hotpot:Annette Bening
  title: Annette Bening
  text: Annette Carol Bening (born May 29, 1958) is an American actress.  She began
    her career on stage with the Colorado Shakespeare Festival company in 1980, and
    played Lady Macbeth in 1984 at the American Conservatory Theatre.  She was nominated
    for the 1987 Tony Award for Best Featured Actress in a Play for her Broadway debut
    in "Coastal Disturbances".  She is a four-time Academy Award nominee; for "The
    Grifters" (1990), "American Beauty" (1999), "Being Julia" (2004) and "The Kids
    Are All Right" (2010).  In 2006, she received a star on the Hollywood Walk of
    Fame.
- id: 07d8a2308c3c
  source: hotpot:Farrah Fawcett
  title: Farrah Fawcett
  text: Farrah Fawcett (born Ferrah Leni Fawcett; February 2, 1947 – June 25, 2009)
    was an American actress, model, and artist.  A four-time Emmy Award nominee and
    six-time Golden Globe Award nominee, Fawcett rose to international fame when she
    posed for her iconic red swimsuit poster – which became the best selling pin-up
    poster in history – and starred as private investigator Jill Munroe in the first
    season of the television series "Charlie's Angels" (1976–1977).  In 1996, she
    was ranked No. 26 on "TV Guide"'s "50 Greatest TV stars of All-Time".
- id: 89fdcab9457d
  source: hotpot:List of stars on the Hollywood Walk of Fame
  title: List of stars on the Hollywood Walk of Fame
  text: The following is a list of the stars' actual locations on the Hollywood Walk
    of Fame.  The list does not include a star's name until his or her actual award
    ceremony, as on multiple occasions and for various reasons stars have been withdrawn
    prior to the award ceremony.  The list should be consistent with the list on the
    Hollywood Walk of Fame website maintained by the Hollywood Chamber of Commerce.  The
    stars are ordered alphabetically by surname.
- id: 49c23a3bb169
  source: hotpot:Kevin Bacon
  title: Kevin Bacon
  text: 'Kevin Norwood Bacon (born July 8, 1958) is an American actor and musician.  His
    notable films include musical-drama film "Footloose" (1984), the controversial
    historical conspiracy legal thriller "JFK" (1991), the legal drama "A Few Good
    Men" (1992), the historical docudrama "Apollo 13" (1995), and the mystery drama
    "Mystic River" (2003).  Bacon is also known for taking on darker roles such as
    that of a sadistic guard in "Sleepers" (1996) and troubled former child abuser
    in a critically acclaimed performance in "The Woodsman" (2004).  He is equally
    prolific on television, having starred in the Fox drama series "The Following"
    (2013–2015).  For the HBO original film "Taking Chance" (2009), Bacon won a Golden
    Globe Award and a Screen Actors Guild Award, also receiving a Primetime Emmy Award
    nomination. " The Guardian" named him one of the best actors never to have received
    an Academy Award nomination.  In 2003, Bacon received a star on the Hollywood
    Walk of Fame for his contributions to '
- id: dc38e8f3f10a
  source: hotpot:Larry R. Williams
  title: Larry R. Williams
  text: Larry Richard Williams (born October 6, 1942) is an American author, stock
    and commodity trader, and politician from the state of Montana.  He is the father
    of four-time Academy Award and one-time Tony Award nominee actress Michelle Williams.
- id: ba7e9c0b3a87
  source: hotpot:The Great Outdoors (film)
  title: The Great Outdoors (film)
  text: The Great Outdoors is a 1988 American comedy film directed by Howard Deutch,
    and written and produced by John Hughes.  It stars Dan Aykroyd, John Candy, Stephanie
    Faracy and Annette Bening in her film debut.
- id: 8b5806a83c11
  source: hotpot:John Lithgow
  title: John Lithgow
  text: John Arthur Lithgow ( ; born October 19 , 1945) is an American actor, musician,
    singer, comedian, voice actor, and author.  He has received two Tony Awards, six
    Emmy Awards, two Golden Globe Awards, three Screen Actors Guild Awards, an American
    Comedy Award, four Drama Desk Awards and has also been nominated for two Academy
    Awards and four Grammy Awards.  Lithgow has received a star on the Hollywood Walk
    of Fame and has been inducted into the American Theater Hall of Fame.
- id: 03d6c5dceab1
  source: hotpot:Joey Vera
  title: Joey Vera
  text: Joseph "Joey" Vera (born April 24, 1963) is an American heavy metal bassist
    who is known as a member of the heavy metal band Armored Saint and the progressive
    metal band Fates Warning.  In 2004-2005 he replaced Frank Bello in Anthrax as
    the band's bassist, but did not record with them.  He was also a member of Engine,
    recorded with Tribe After Tribe, and appears on the OSI album "Free".  His first
    solo album, "A Thousand Faces", was released in 1994.  His current solo project,
    A Chinese Firedrill, released an album titled "Circles" in 2007.
- id: 47dd81cce921
  source: hotpot:Hurt Locker (musical)
  title: Hurt Locker (musical)
  text: 'Hurt Locker The Musical is a fictional musical in the 2014 Broadway premiere
    production of "Hedwig and the Angry Inch".  In the Broadway performance of "Hedwig
    and the Angry Inch" the musical opens with Hedwig explaining that the musical
    only ran for a single night before closing during intermission, and that she has
    convinced a producer to let her perform in what would otherwise be an empty stage.  Fake
    Playbills for the musical are used as props and are found scattered on the floor
    of the Belasco Theatre and contains advertisements for other fake musicals based
    on feature films such as "Gravity on Ice", "Container Store: The Musical", "The
    Entire Bible", and "SoulCycle on Broadway".  The Playbills, which describe the
    musical as having "explosions, negligible storytelling, camouflage and tits",
    also state that the musical''s cast included actors such as Taye Diggs (who would
    go on to play the role of Hedwig in the summer of 2015) and that the music was
    written by Metallica and Stephen '
- id: c5a285f522fb
  source: hotpot:Obús
  title: Obús
  text: 'Obús is a Spanish heavy metal band created in Madrid in the early 80s.  They
    stood out because they took the risk of making a big spectacle in their concerts
    in order to reach to the level of other international heavy metal bands.  In addition,
    the lyrics they write and the feelings they transmit connect with the people that
    follow them.  As they said in an interview: "All our songs , some more and some
    less, have a meaning".  Far away from renouncing to their genre, they have always
    claimed that they were a heavy metal band and they even wrote a song about this
    genre in their first LP called"Dosis de Heavy Metal". In 2012, because of their
    30th anniversary, they did a Tour around Spain.'
- id: 26f25ec5e7c6
  source: hotpot:Metal Health
  title: Metal Health
  text: Metal Health is the third studio album by American heavy metal band Quiet
    Riot.  It was released on March 11, 1983, bolstered by the No. 5 hit "Cum On Feel
    the Noize" and the No. 31 hit "Metal Health".  "Metal Health" is notable for being
    the first heavy metal album to reach the top spot on the "Billboard" 200, replacing
    the Police's "Synchronicity" at number one in November 1983.  The album went on
    to sell more than six million copies and is considered a classic among heavy metal
    fans.  Some critics, such as AllMusic, describe it as a one-hit wonder, owing
    to Quiet Riot's relative lack of critical and commercial success with following
    albums (and subsequent disintegration) towards the end of the 1980s.  The title
    track was ranked No. 35 on VH1's 40 Greatest Metal Songs.
- id: 77b4c162d8a4
  source: hotpot:Joey Jordison
  title: Joey Jordison
  text: Nathan Jonas "Joey" Jordison (born April 26, 1975), is an American musician,
    songwriter, record producer and multi-instrumentalist, best known for his work
    as the former drummer and co-songwriter for the American heavy metal band Slipknot
    as well as guitarist in the American horror punk band Murderdolls.  Jordison played
    in Slipknot since their formation in 1995 until his departure from the band in
    December 2013.  He was the drummer and founder of the American heavy metal band
    Scar the Martyr which formed in 2013 and disbanded in 2016.  He grew up in Waukee,
    Iowa with his parents and two sisters, and was given his first drum kit at the
    age of 8.  He performed in several bands until joining in the summer of 1995 with
    the group The Pale Ones, which would later change their name to Slipknot.  Of
    Slipknot's nine-member lineup which lasted from 1999–2010, Joey was the third
    to join the band.
- id: 6f269bf71bc8
  source: hotpot:Black 'n Blue
  title: Black 'n Blue
  text: Black 'N Blue is an American heavy metal band from Portland, Oregon.  The
    current members are singer Jaime St. James, bassist Patrick Young, drummer Pete
    Holmes, guitarist Bob Capka, and guitarist Brandon Cook.
- id: ef25355aac30
  source: hotpot:Machine Head (band)
  title: Machine Head (band)
  text: Machine Head is an American heavy metal band from Oakland, California.  Formed
    on October 12, 1991, the group was founded by vocalist/guitarist Robb Flynn and
    bassist Adam Duce.  The current lineup of the band comprises Flynn, drummer Dave
    McClain, guitarist Phil Demmel and bassist Jared MacEachern.  Machine Head is
    one of the pioneering bands in the new wave of American heavy metal.
- id: a0efb23b1c03
  source: hotpot:Dan Spitz
  title: Dan Spitz
  text: Daniel Alan Spitz (born January 28, 1963) is an American musician and watchmaker
    best known for his work as the lead guitarist, principal songwriter and co-producer
    of the American heavy metal band Anthrax from 1983 to 1995 and from 2005 to 2008.  With
    Anthrax, Spitz was nominated for three Grammy awards and has been awarded platinum
    and multiple platinum RIAA certified albums for his entire Anthrax catalog of
    work.  Dan Spitz is the first heavy metal songwriter to have his music playing
    on two planets.  NASA chose his song alongside only 9 other artists such as Frank
    Sinatra and the Beatles to be played on the Lunar Rover Curiosity making him the
    first heavy metal artist to have a top 10 charting song on two planets.  Spitz
    also founded the Christian music group Red Lamb alongside Dave Mustaine of Megadeth
    as his writing partner, the first to bring autism awareness into any genre of
    music or music video.
- id: af4c4992b3db
  source: hotpot:Nu metal
  title: Nu metal
  text: Nu metal (also known as nü-metal and aggro-metal ) is a form of alternative
    metal that combines elements of heavy metal music with elements of other music
    genres such as hip hop, alternative rock, funk and grunge.  Nu metal bands have
    drawn elements and influences from a variety of musical styles, including multiple
    genres of heavy metal.  Nu metal rarely features guitar solos; the genre is heavily
    syncopated and based on guitar riffs.  Many nu metal guitarists use seven-string
    guitars that are down-tuned to play a heavier sound.  DJs are occasionally featured
    in nu metal to provide instrumentation such as sampling, turntable scratching
    and electronic backgrounds.  Vocal styles in nu metal include singing, rapping,
    screaming and growling.  Nu metal is one of the key genres of the new wave of
    American heavy metal.
- id: e9a78d23f06c
  source: hotpot:Metallica
  title: Metallica
  text: Metallica is an American heavy metal band based in San Rafael, California.  The
    band was formed in 1981 in Los Angeles when vocalist/guitarist James Hetfield
    responded to an advertisement posted by drummer Lars Ulrich in a local newspaper.  Metallica's
    current lineup comprises founding members Hetfield and Ulrich, longtime lead guitarist
    Kirk Hammett, and bassist Robert Trujillo.  Guitarist Dave Mustaine (who went
    on to form Megadeth) and bassists Ron McGovney, Cliff Burton, and Jason Newsted
    are also former members of the band.
- id: cde4c4b125e5
  source: hotpot:My Finale
  title: My Finale
  text: '"My Finale" is the hour-long season finale for season eight of the American
    sitcom "Scrubs".  It was originally broadcast as episodes 18 and 19 of season
    eight on May 6, 2009, and was intended to be the series finale during production.  However,
    the episode was billed as the "Scrubs finale" as at the time of airing it was
    unknown whether this would be the series finale or the season finale.  The show
    ended up returning for a ninth season.  As the show underwent many changes for
    the ninth and final season, this is the last episode in which all of the main
    cast appear as series regulars.'
- id: 09936cdf716d
  source: hotpot:Desperate Housewives (season 2)
  title: Desperate Housewives (season 2)
  text: The second season of the American dramedy-mystery television series "Desperate
    Housewives" commenced airing in the United States on September 25, 2005 and concluded
    on May 21, 2006.  The season continues the story of the Wisteria Lane residents,
    while their seemingly perfect lives in the suburban neighborhood are shaken by
    the arrival of the mysterious Betty Applewhite.  Broadcast in the Sunday night
    time slot at 9.00 ET, the season aired twenty-four regular episodes, including
    a two-part season finale.  In addition, three clip shows were produced for the
    season, in order to put the previous events of the show in perspective. " All
    the Juicy Details" aired before the eleventh episode, detailing the most memorable
    events of the season's first half, whereas "The More You Know, The Juicier It
    Gets", which aired before the twentieth episode, prepared the viewers for the
    highly anticipated season finale. " Time to Come Clean" aired three weeks before
    the inception of the third season, and r
- id: 57ac5bec230d
  source: hotpot:List of Republic of Doyle episodes
  title: List of Republic of Doyle episodes
  text: This is a list of episodes for the Canadian crime series "Republic of Doyle".  The
    series debuted on CBC Television on January 6, 2010 with 969,000 viewers.  The
    season finale aired on April 7, 2010 and drew 1,120,000 viewers.  The second season
    debuted on January 12, 2011 with 1,038,000 viewers.  The second-season finale
    aired on April 6, 2011 and drew 1,265,000 viewers.  The third season debuted on
    January 11, 2012 with 1,361,000 viewers, and the season finale drew 968,000 viewers.
- id: '238981259558'
  source: hotpot:Human Error (House)
  title: Human Error (House)
  text: '"Human Error" is the twenty-fourth episode and season finale of the third
    season of "House" and the seventieth episode overall.'
- id: dbd8072af9b9
  source: hotpot:The Price of Free and Fair Elections
  title: The Price of Free and Fair Elections
  text: '"The Price of Free and Fair Elections" is the 18th episode and season finale
    of the third season of the American political thriller television series "Scandal",
    and is the 47th overall episode.  It aired on April 17, 2014 on ABC in the United
    States.  The episode was written by showrunner Shonda Rhimes and executive producer
    Mark Wilding and directed by executive producer Tom Verica.  The season finale
    was originally supposed to be the 22nd episode, but because of the show''s lead
    Kerry Washington''s pregnancy, the episode count was trimmed by ABC by four episodes,
    leading the season finale to be the 18th episode.'
- id: e0ced26c371d
  source: hotpot:Robert Chase
  title: Robert Chase
  text: Robert Chase, MBBS is a fictional character on the Fox medical drama "House".  He
    is portrayed by Jesse Spencer.  His character was a part of the team of diagnosticians
    who worked under Gregory House until the end of the third season when House fires
    him.  However, he resumed work at the hospital as a surgeon, and was re-hired
    by House in season 6.  Robert Chase is the longest-serving member of House's staff.  Chase
    has been attracted to Allison Cameron since the beginning of the show and embarks
    on a romantic relationship with her in "Human Error."  In "Post Mortem," he left
    the Diagnostic Team after realizing he was in the same position as he was 10 years
    earlier, unlike all of the other former members of the team.  However, in the
    series finale, he rejoins the hospital as the new Head of Diagnostic Medicine,
    replacing House, who is thought to have died.
- id: 9107e58d25e9
  source: hotpot:The Voice Portugal
  title: The Voice Portugal
  text: The Voice Portugal (A Voz de Portugal in the first season) is a Portuguese
    reality singing competition and local version of The Voice originally broadcast
    as The Voice of Holland.  It premiered on 29 October 2011, on RTP1, with the first
    season finale airing on February 25, 2012, crowning Denis Filipe as the winner.  The
    show came back in 2014 with its second season with new judges, a new co-host,
    a new show name, and new "Repórteres V" (backstage hosts).  The winner of the
    second season was Rui Drummond.  RTP1 later announced the first season of "The
    Voice Kids Portugal" and the third season of the main show.  The third season
    premiered October 11, 2015 with new judge, Aurea.  In its third season, the show
    proved to be a hit and was subsequently renewed for a fourth season, which was
    premiered in 2016.
- id: c147bae6a51a
  source: hotpot:House (TV series)
  title: House (TV series)
  text: House (also called House, M.D.) is an American television medical drama that
    originally ran on the Fox network for eight seasons, from November 16, 2004 to
    May 21, 2012.  The series' main character is Dr. Gregory House (Hugh Laurie),
    an unconventional, misanthropic medical genius who, despite his dependence on
    pain medication, leads a team of diagnosticians at the fictional Princeton–Plainsboro
    Teaching Hospital (PPTH) in New Jersey.  The series' premise originated with Paul
    Attanasio, while David Shore, who is credited as creator, was primarily responsible
    for the conception of the title character.  The series' executive producers included
    Shore, Attanasio, Attanasio's business partner Katie Jacobs, and film director
    Bryan Singer.  It was filmed largely in Century City.
- id: dc2fa770733d
  source: hotpot:Through the Looking Glass (Lost)
  title: Through the Looking Glass (Lost)
  text: '"Through the Looking Glass" is the third season finale of the ABC television
    series "Lost", consisting of the 22nd and 23rd episodes of the third season.  It
    is also the 71st and 72nd episodes overall.  It was written by co-creator/executive
    producer Damon Lindelof and executive producer Carlton Cuse, and directed by executive
    producer Jack Bender.  When first aired on May 23, 2007, in the United States
    and Canada, it was watched by an average of 14 million American viewers.  Like
    the previous two season finales, it was two hours long with advertisements, twice
    the length of a normal episode.  It was edited into two individual episodes when
    released on DVD.  The season finale is considered by some to be one of the best
    episodes of television ever broadcast.  The episode garnered a number of awards
    and nominations, including three Primetime Emmy Awards nominations and a Directors
    Guild of America Award nomination.'
- id: 1209e0a67bd2
  source: hotpot:Mr. Yin Presents...
  title: Mr. Yin Presents...
  text: '"Mr. Yin Presents" (stylized as "Mr. Yin Presents...") is the sixteenth and
    final episode of the Fourth season of "Psych", and the 63rd episode in the series
    overall.  It premiered on March 10, 2010 on USA Network in the United States.  The
    episode serves as the season 4 finale and is the sequel to the third season''s
    finale, "An Evening with Mr. Yang".  It is an important installment in one of
    the series'' few story arcs.  A third and final installment of the Yin/Yang series,
    entitled "Yang 3 in 2D", aired as the fifth season finale.'
- id: 071bcc14f75a
  source: hotpot:Last Dance (Dua Lipa song)
  title: Last Dance (Dua Lipa song)
  text: '"Last Dance" is a song by English singer Dua Lipa from her eponymous debut
    studio album (2017).  Lipa wrote the song with Stephen "Koz" Kozmeniuk and Talay
    Riley, with Kozmeniuk handling the song''s production.  It was released on 9 February
    2016 as the album''s second single.  The track appears on the deluxe edition of
    "Dua Lipa".  It peaked at number four on the "Billboard" Twitter Emerging Artists
    chart, spending seven weeks on it.'
- id: 7b995af332f1
  source: hotpot:Dua Lipa
  title: Dua Lipa
  text: Dua Lipa ( ; ] ; born 22 August 1995) is an English singer, songwriter and
    model.  Her musical career began at age 16, when she began covering songs by other
    artists on YouTube.  In 2015, she was signed with Warner Music Group, and released
    her first single soon after.  In December 2016, a documentary about Lipa was commissioned
    by "The Fader" magazine, titled "See in Blue".  In January 2017, she won the EBBA
    Public Choice Award.  Her self-titled debut studio album was released on 2 June
    2017.  The album spawned seven singles, including the top-10 single "Be the One"
    and the number-one single "New Rules".
- id: 4b9fa8dc06ab
  source: hotpot:Lost in Your Light
  title: Lost in Your Light
  text: '"Lost in Your Light" is a song by English singer Dua Lipa, featuring American
    singer Miguel.  The song was released on 21 April 2017 as the fifth single from
    Lipa''s eponymous debut studio album.  It was released as an instant-grat track
    to those who pre-ordered the song on the iTunes Store.  The song was written by
    Lipa, Miguel, and Rick Nowels, while production was handled by Miguel and Stephen
    "Koz" Kozmeniuk.  The accompanying music video, directed by Henry Schofield, was
    filmed in Los Angeles and premiered on 26 May 2017.'
- id: 6910147e841e
  source: hotpot:Be the One (Dua Lipa song)
  title: Be the One (Dua Lipa song)
  text: '"Be the One" is a song by English singer Dua Lipa from her eponymous debut
    studio album (2017).  It was written by Lucy Taylor, Digital Farm Animals and
    Jack Tarrant, and produced by Digital Farm Animals.  The song was released on
    30 October 2015 as the album''s lead single.'
- id: f2b8a488d226
  source: hotpot:Hotter than Hell Tour (Dua Lipa)
  title: Hotter than Hell Tour (Dua Lipa)
  text: Hotter than Hell Tour is the second official concert tour by English singer
    Dua Lipa, in support of her debut studio album "Dua Lipa" (2017).  It is named
    after her hit single "Hotter than Hell".
- id: 04b0eac66619
  source: hotpot:Blow Your Mind (Mwah)
  title: Blow Your Mind (Mwah)
  text: '"Blow Your Mind (Mwah)" is a song by English singer Dua Lipa from her eponymous
    debut studio album (2017).  It was released on 26 August 2016 as the album''s
    fourth single.  The song debuted at number 50 and peaked at number 30 on the UK
    Singles Chart; in the United States, it reached number 72 on the "Billboard" Hot
    100, becoming Lipa''s first song to chart in the country.  It also topped the
    "Billboard" Dance Club Songs chart, becoming Lipa''s first number-one single on
    that chart.'
- id: bbebc39dc88f
  source: hotpot:US and Europe Tour
  title: US and Europe Tour
  text: The US and Europe Tour is the third official concert tour by English singer
    Dua Lipa.  The tour supports her debut studio album "Dua Lipa" (2017).  The tour
    began on 24 February 2017 in Chicago.
- id: 9511a12f1c71
  source: hotpot:Dua Lipa (album)
  title: Dua Lipa (album)
  text: Dua Lipa is the debut studio album by English singer Dua Lipa.  It was released
    on 2 June 2017 by Warner Bros.  Records.  The lyrical themes revolve around her
    personal views of love, rising above, sex and self-empowerment.
- id: 308d6ae2f116
  source: hotpot:New Rules (song)
  title: New Rules (song)
  text: '"New Rules" is a song by English singer Dua Lipa from her eponymous debut
    studio album (2017).  The track was written by Caroline Ailin, Emily Warren and
    Ian Kirkpatrick, while production was handled by the latter.  It was released
    to contemporary hit radio in the United Kingdom on 21 July 2017 as the album''s
    sixth single.  It impacted the same format in the United States on 22 August 2017.'
- id: c1ef3906cddb
  source: hotpot:Hotter than Hell (Dua Lipa song)
  title: Hotter than Hell (Dua Lipa song)
  text: '"Hotter than Hell" is a song by English singer Dua Lipa from her eponymous
    debut studio album (2017).  It was written by Lipa, Adam Midgley, Tommy Baxter
    and Gerard O''Connell, and produced by Stephen "Koz" Kozmeniuk.  The song was
    released on 6 May 2016 as the album''s third single.  "Hotter than Hell" peaked
    at number 15 on the UK Singles Chart, while reaching the top 20 in Australia,
    Belgium and the Netherlands.'
- id: b7c727fea72d
  source: hotpot:Kamala Harris
  title: Kamala Harris
  text: Kamala Devi Harris ( , ; born October 20, 1964) is an American attorney and
    politician.  A member of the Democratic Party, she currently serves as the junior
    senator from California.  She previously served as the 32nd Attorney General of
    California.
- id: a2e949b966f9
  source: hotpot:Maryland Attorney General election, 2014
  title: Maryland Attorney General election, 2014
  text: The Maryland Attorney General election of 2014 was held on November 4, 2014,
    to elect the Attorney General of Maryland.  Incumbent Democratic Attorney General
    Doug Gansler was eligible to seek a third term in office, but instead ran unsuccessfully
    for the Democratic nomination for Governor of Maryland.
- id: 418584134e63
  source: hotpot:Corey Palumbo
  title: Corey Palumbo
  text: Corey Lee Palumbo (born August 16, 1972) is a West Virginia State Senator
    representing the 17th district in the West Virginia Senate.  A state senator since
    2009, he previously served as a member of the West Virginia House of Delegates
    from 2003 to 2009.  He is the son of Mario Palumbo, the 32nd Attorney General
    of West Virginia as well as a former five-term state senator.
- id: d5f4123840fb
  source: hotpot:Catherine Cortez Masto
  title: Catherine Cortez Masto
  text: Catherine Marie Cortez Masto (born March 29, 1964) is an American attorney
    and politician who is the junior United States Senator from Nevada.  She is a
    member of the Democratic Party.  She previously served as the 32nd Attorney General
    of Nevada from 2007 to 2015.
- id: 07b84a4228fe
  source: hotpot:Joe Heck
  title: Joe Heck
  text: Joseph John “Joe” Heck (born October 30, 1961) is an American politician,
    physician, and U.S. Army Brigadier General who had served as the U.S. Representative
    for Nevada's 3rd congressional district from 2011 to 2017.  Heck, a member of
    the Republican Party, is a board-certified physician and served as a Nevada State
    Senator from 2004-08.  He ran unsuccessfully against Democrat Catherine Cortez
    Masto in the general election for the open Nevada United States Senate seat in
    2016.  In the same year, Heck made headlines by joining a long list of Republicans
    who opposed the GOP nominee for President, Donald Trump.
- id: 63d2558c5aaf
  source: hotpot:List of United States Senators from Nevada
  title: List of United States Senators from Nevada
  text: Nevada was admitted to the Union on October 31, 1864.  Its current senators
    are Democrat Catherine Cortez Masto (Class 3) and Republican Dean Heller (Class
    1).
- id: 31a40c77e705
  source: hotpot:Dennis Heck
  title: Dennis Heck
  text: Dennis Lynn "Denny" Heck (born July 29, 1952) is an American politician who
    has been the United States Representative for Washington's 10th congressional
    district since 2013.  Heck was previously the Democratic nominee for U.S. Representative
    for the 3rd district in 2010, but was defeated by Jaime Herrera Beutler (R).  In
    2012 Heck ran and won in the newly created 10th district, defeating Republican
    Dick Muri.
- id: 6dc11a81f8a1
  source: hotpot:Samuel D. Jackson
  title: Samuel D. Jackson
  text: Samuel Dillon Jackson (May 28, 1895March 8, 1951) was a United States Senator
    from Indiana.  Born near Zanesville, Indiana, he attended the public schools of
    Fort Wayne and graduated from a predecessor of the now Indiana University Robert
    H. McKinney School of Law in Indianapolis in 1917, gaining admission to the bar
    the same year.  During the First World War, he served as a captain of infantry
    from 1917 to 1919, and engaged in the practice of law at Fort Wayne in 1919.  He
    was prosecuting attorney of Allen County from 1924 to 1928.  He ran unsuccessfully
    as a Democrat for election in 1928 to the Seventy-first Congress, and was attorney
    general of Indiana from 1940 to 1941.  On January 28, 1944, he was appointed as
    a Democrat to the U.S. Senate to fill the vacancy caused by the death of Frederick
    Van Nuys and served from January 28, 1944, to November 13, 1944, when a duly elected
    successor qualified.  Jackson was not a candidate for election to fill the vacancy,
    and was an unsuccessful
- id: 3611db78d2cf
  source: hotpot:George Henry Williams
  title: George Henry Williams
  text: George Henry Williams (March 26, 1823April 4, 1910) was an American judge
    and politician.  He served as Chief Justice of the Oregon Supreme Court, was the
    32nd Attorney General of the United States, and was elected Oregon's U.S. Senator,
    and served one term.  Williams, as U.S. Senator, authored and supported legislation
    that allowed the U.S. military to be deployed in Reconstruction southern states
    to allow for an orderly process of readmittance into the United States.  Williams
    was the first presidential Cabinet member to be appointed from the Pacific Coast.  As
    attorney general under President Ulysses S. Grant, Williams continued the prosecutions
    that shut down the Ku Klux Klan.  He had to contend with controversial election
    disputes in Reconstructed southern states.  President Grant and Williams legally
    recognized P. B. S. Pinchback as the first African American state governor.  Williams
    ruled that the "Virginius", a gun-running ship captured by Spain during the Virginius
    Affair, di
- id: 6f2993ae01b3
  source: hotpot:Jeff Harris (politician)
  title: Jeff Harris (politician)
  text: Jeff Harris (born October 7, 1964) is an attorney and a Missouri Democratic
    politician.  He represented the 23rd District of Missouri in the Missouri House
    of Representatives from 2003–2009 and ran unsuccessfully for the office of attorney
    general in 2008.  He served as Minority Floor Leader before giving up the post
    in order to focus more time on the attorney general race.
- id: fa8d1a666c79
  source: hotpot:USA Drug
  title: USA Drug
  text: USA Drug is a convenience store and pharmacy chain in the United States that
    operates more than 160 stores in Arkansas, Oklahoma, Mississippi, Missouri, and
    Tennessee.  It was founded in Pine Bluff, Arkansas in 1986.  Its headquarters
    are still located in Pine Bluff with additional offices in Little Rock, Arkansas,
    Tulsa, Oklahoma, and Memphis, Tennessee.  Its parent company, Walgreens, operates
    Super D Drug Stores and Ikes Deep Discount Drug, both acquired in October 1997,
    and May's Drug, Med-X Drug, Drug Warehouse, and Drug Mart, all acquired in July
    2004, as "Part of the USA Drug Family".  Wal-Mart and CVS/Pharmacy are two of
    its primary competitors.  The company's slogan is "America's Low Price Drug Store".
- id: fa3a9e083403
  source: hotpot:Perry Drug Stores
  title: Perry Drug Stores
  text: Perry Drug Stores was an American retail pharmacy chain founded in 1957 in
    the city of Pontiac, Michigan, United States.  At its peak in the 1980s, Perry
    operated more than 200 drug stores, primarily in the state of Michigan, as well
    as 200 Auto Works auto parts stores and fourteen A. L. Price discount health and
    beauty aids outlets.
- id: 87cd58308c19
  source: hotpot:Longs Drugs
  title: Longs Drugs
  text: Longs Drugs is an American chain with approximately 40 drug stores throughout
    the state of Hawaii.
- id: b885f29058a4
  source: hotpot:Thrifty PayLess
  title: Thrifty PayLess
  text: Thrifty PayLess Holdings, Inc. was a pharmacy holding company that owned the
    Thrifty Drugs and PayLess Drug Stores chains in the western United States.  The
    combined company was formed in April 1994 when Los Angeles-based TCH Corporation,
    the parent company of Thrifty Corporation and Thrifty Drug Stores, Inc., acquired
    the Kmart subsidiary PayLess Drug Stores Northwest, Inc.  At the time of the merger,
    TCH Corporation was renamed Thrifty PayLess Holdings, Inc. and Thrifty operated
    495 stores, PayLess operated 543 stores.
- id: 297a3311665a
  source: hotpot:Leader Drug Stores
  title: Leader Drug Stores
  text: Leader Drug Stores is a network of over 3,100 independently owned and operated
    pharmacies.  It has a business affiliation with Cardinal Health, which sponsors
    the network and owns the name "Leader Drug Stores".  Cardinal Health also owns
    the franchise chain The Medicine Shoppe.  It operates like a retailers' cooperative,
    though it is not owned by its members.
- id: 78039c575b0f
  source: hotpot:Gray Drug
  title: Gray Drug
  text: Gray Drug was a drugstore chain in Cleveland, Ohio.  The chain began in 1912
    and grew to 46 stores by 1946 and over 100 by the 1970s.  Besides Ohio, stores
    later opened in Florida and Maryland.  The chain later acquired Drug Fair in 1981,
    shortly before Sherwin Williams bought the chain.  Gray Drug acquired several
    Cunningham Drug stores in 1982.
- id: 4b33ca1be43e
  source: hotpot:Hartig Drug
  title: Hartig Drug
  text: Hartig Drug Stores is a chain of pharmacy/retail stores based out of Dubuque,
    Iowa.  The company provides pharmacy services not only to the general public,
    but to area institutions as well.  Along with this pharmacy focus, Hartig Drug
    stores offer convenience retail items.  The company has operated for over 100
    years; currently, it is the second-oldest family-run pharmacy chain in the United
    States.
- id: d1a9213f6a54
  source: hotpot:Warren Bryant
  title: Warren Bryant
  text: Warren Bryant was the CEO of Longs Drugs Store Corporation out of California
    prior to the retail chain's acquisition by CVS/Caremark.  Hired in 2002 to Longs,
    he was Senior Vice President of The Kroger Company. , a retail grocery chain,
    from 1999 to 2002.  Prior to that, from 1996 to 1999, he was President and Chief
    Executive Officer of Dillon Companies, Inc., a retail grocery chain and subsidiary
    of The Kroger Co.  He is also a director of OfficeMax Incorporated.
- id: d3277c96e5e6
  source: hotpot:Cunningham Drug (U.S.)
  title: Cunningham Drug (U.S.)
  text: Cunningham Drug was a drugstore chain based in Detroit, Michigan.  Founded
    in October 1889 by Andrew Cunningham, the chain operated primarily within the
    state of Michigan, and was once the largest drugstore chain in the state.  Its
    Michigan locations were closed and reopened in 1982 as Apex Drug, and were later
    sold to Perry Drug Stores.  The last stores remained open in Florida until 1991,
    when they were sold to Walgreens.
- id: 30f73555e6b3
  source: hotpot:Rexall
  title: Rexall
  text: Rexall is a chain of American drugstores, and the name of their store-branded
    products.  The stores, having roots in the federation of United Drug Stores starting
    in 1903, licensed the Rexall brand name to as many as 12,000 drug stores across
    the United States from 1920 to 1977.  (The "Rex" in the name came from the common
    Rx abbreviation for medical prescriptions.)
- id: 7728f6d7de41
  source: hotpot:Mike Dmitrich
  title: Mike Dmitrich
  text: Mike Dmitrich (born 1936) is an American politician and Natural Resource Consultant
    from Utah.  A Democrat, he served as a member of the Utah State Senate, representing
    the state's 27th senate district in Price.  Dmitrich served as the Minority Leader
    in the Utah Senate.  Prior to being elected to the Utah Senate Dmitrich served
    in the State House from 1969 to 1992.  He retired prior to the 2008 elections
    and was replaced by David P. Hinkins.
- id: db4189a938a6
  source: hotpot:Maurice A. Donahue
  title: Maurice A. Donahue
  text: Maurice A. Donahue (September 21, 1918 – January 13, 1999) is an American
    politician who served as President of the Massachusetts Senate from 1964 to 1971.
- id: 98e945be9fb9
  source: hotpot:John Hoeven
  title: John Hoeven
  text: John Henry Hoeven III (born March 13, 1957) is an American politician and
    the senior United States Senator from North Dakota, in office since 2011.  A member
    of the North Dakota Republican Party, he previously served as the 31st Governor
    of North Dakota from December 2000 to December 2010.  Hoeven was elected to the
    U.S. Senate in the November 2, 2010 general election.  He replaced junior Senator
    Byron L. Dorgan, who chose not to seek re-election.  Hoeven became the senior
    Senator in 2013 after Kent Conrad retired and was replaced by Heidi Heitkamp,
    who was once Hoeven's opponent for the Governor's office.
- id: ab2e487eefde
  source: hotpot:Anne Donahue
  title: Anne Donahue
  text: Anne de la Blanchetai Donahue is an American politician from the state of
    Vermont.  She has served as a Republican member of the Vermont House of Representatives
    since 2003, representing the Washington-2 district, which includes the Washington
    County towns of Berlin and Northfield.  She is also editor of "Counterpoint",
    a quarterly mental health publication distributed for free throughout Vermont.
- id: 86a28dc18daf
  source: hotpot:Sue Donahue
  title: Sue Donahue
  text: Sue Donahue is an American politician.  Donahue was appointed in 2016 to serve
    in the Arizona State Senate representing the fifth legislative district as a member
    of the Republican Party.  Donahue replaced Kelli Ward who resigned to run for
    the United States Senate.  Donahue did not run for re-election in 2016 and was
    replaced by Sonny Borrelli.
- id: 9213945dc4ef
  source: hotpot:Frank J. Donahue
  title: Frank J. Donahue
  text: Frank J. Donahue (1881–1979) was an American politician who served as the
    Massachusetts Secretary of the Commonwealth, Chairman of the Massachusetts Democratic
    State Committee, and as an Associate Justice of the Massachusetts Superior Court.
- id: dce9c4bb40ba
  source: hotpot:Charles Harlow
  title: Charles Harlow
  text: Charles W. Harlow (born May 25, 1942) is an American politician from Maine.  Harlow
    served on the Portland, Maine City Council from 1990 to 1999, including a term
    as ceremonial mayor from 1992 to 1993.  In 2004, Harlow was elected as a Democrat
    to the Maine House of Representatives from District 116.  He served until 2010,
    when he was replaced by his daughter, Denise Harlow.
- id: bca632d0eb5d
  source: hotpot:Kelli Ward
  title: Kelli Ward
  text: Kelli Ward ("née" Kaznoski; born January 25, 1969) is an American politician
    and osteopathic physician.  A member of the Republican Party, Ward was elected
    in 2012 to serve in the Arizona State Senate representing the fifth legislative
    district.  She was unopposed for election in 2014.  While serving in office, she
    continued to practice medicine in the emergency departments in Lake Havasu City
    and Kingman, Arizona.
- id: b9baf3370d5b
  source: hotpot:Dan Donahue
  title: Dan Donahue
  text: Daniel M. Donahue is an American politician serving in the Massachusetts House
    of Representatives since September 2013.  He is a Worcester resident and a member
    of the Democratic Party.
- id: 32b8ec3539a2
  source: hotpot:Warren Furutani
  title: Warren Furutani
  text: Warren T. Furutani (born October 16, 1947) is an American politician who served
    in the California State Assembly.  He is a Democrat and a fourth-generation Japanese
    American.  Furutani was elected in a special election in 2008.  He replaced Laura
    Richardson as the member of the US House of Representatives from California's
    37th district.  Prior to being elected, he served on the Los Angeles Unified School
    District and then the Los Angeles Community College District Board of Trustees.  He
    was the first Asian Pacific American ever elected to the LAUSD in 1987 and became
    the board's president in 1991.
- id: 834d6d727040
  source: hotpot:Nobody's Daughter
  title: Nobody's Daughter
  text: Nobody's Daughter is the fourth and final studio album by American alternative
    rock band Hole, released worldwide on April 27, 2010, through Mercury Records.  The
    album was originally conceived by Hole frontwoman Courtney Love as a solo project
    titled "How Dirty Girls Get Clean", following her poorly received solo debut "America's
    Sweetheart" (2004).  Much of the material featured on "Nobody's Daughter" originated
    from studio sessions for "How Dirty Girls Get Clean", which had been conceived
    in 2006 after a multitude of legal issues, drug addiction, and rehabilitation
    sentences had left Love "suicidal".  Love financed the making of the record herself,
    which cost nearly two million dollars.
- id: f7faeedabe0a
  source: hotpot:Courtney Love filmography
  title: Courtney Love filmography
  text: Courtney Love is an American musician and actress who began her professional
    career in film in 1986 with a supporting role in Alex Cox's "Sid and Nancy" (1986);
    she had prior studied film with experimental director George Kuchar at the San
    Francisco Art Institute in 1984, and appeared in one of Kuchar's short films.  After
    pursuing music and having a successful career as the frontwoman of alternative
    rock band Hole, Love also had intermittent roles in films, most notably receiving
    critical attention for her performance as Althea Flynt in Miloš Forman's 1996
    biopic "The People vs. Larry Flynt", which earned her a Golden Globe Nomination
    for Best Actress, as well as awards from the Boston, Chicago, New York, and Los
    Angeles film critics associations.  Love later appeared among an ensemble cast
    in "200 Cigarettes" (1998), as well as in a leading role in "Man on the Moon"
    (1999) alongside Jim Carrey, for which she received critical recognition.  She
    later appeared in several independent fi
- id: be46c1093ba6
  source: hotpot:Patty Schemel
  title: Patty Schemel
  text: Patricia Theresa Schemel (born April 24, 1967) is an American drummer and
    musician who rose to prominence as the drummer of alternative rock band Hole from
    1992 until 1998.  In 1998, Schemel left Hole, and in the early 2000s reunited
    with Hole frontwoman Courtney Love during her solo career, and later drummed for
    Juliette and the Licks.  As of 2010, Schemel continues to play music and gives
    drum lessons, in addition to owning a dog daycare/boarding business.  In 2013,
    Schemel joined the indie rock group Upset, formed by Ali Koehler, previously of
    Vivian Girls and Best Coast.  She also formed a rock and roll band with her brother,
    Larry Schemel, called Death Valley Girls.
- id: b2c10b53db1a
  source: hotpot:Beautiful Son
  title: Beautiful Son
  text: '"Beautiful Son" is a song by American alternative rock band Hole, written
    collectively by frontwoman Courtney Love, lead guitarist Eric Erlandson and drummer
    Patty Schemel.  The song was released as the band''s fourth single in April 1993
    on the European label City Slang.  To coincide with the song''s lyrics, Love used
    a photograph of her husband, Kurt Cobain, at age 7 as the single''s artwork.'
- id: 1ad355bfa9ba
  source: hotpot:The Wolfhounds
  title: The Wolfhounds
  text: The Wolfhounds are an indie pop/noise pop band formed in Romford, UK in 1985
    by Dave Callahan, Paul Clark, Andy Golding, Andy Bolton and Frank Stebbing, and
    originally active until 1990.  The band reformed in 2005 and continues to write,
    record and play live, releasing new albums in 2014 and 2016.
- id: 6c62805baf7a
  source: hotpot:Live Through This
  title: Live Through This
  text: Live Through This is the second studio album by American alternative rock
    band Hole.  It was released by DGC Records on April 12, 1994, just one week after
    frontwoman Courtney Love's husband, Kurt Cobain, died in their home.  It was Hole's
    only album to feature bassist Kristen Pfaff before her death in June 1994.  Recorded
    in October 1993, the album marked a divergence from the band's unpolished hardcore
    aesthetics to more refined melodies and song structure, and features production
    by Sean Slade and Paul Q. Kolderie, with mixing by Scott Litt and J Mascis.  The
    album's lyrics and packaging reflect Love's preoccupation with beauty, and its
    songs contain repeated motifs of milk, motherhood, anti-elitism, and violence
    against women.  The album's title is derived from a quote in "Gone with the Wind".
- id: 7315848f6b1d
  source: hotpot:Turpentine (song)
  title: Turpentine (song)
  text: '"Turpentine" is a song by the American alternative rock band Hole.  It was
    written by vocalist and rhythm guitarist Courtney Love and lead guitarist Eric
    Erlandson.  The song was one of the band''s first compositions and remained unreleased
    for seven years before being released on the band''s second EP, "The First Session"
    on August 26, 1997.  Although not as well known as Hole''s later songs, "Turpentine"
    is a notable song for the band as it is often cited as "the first Hole song."'
- id: 4c797a8bd8e1
  source: hotpot:Miss World (song)
  title: Miss World (song)
  text: '"Miss World" is a song by American alternative rock band Hole, written by
    frontwoman Courtney Love and lead guitarist Eric Erlandson.  The song was released
    as the band''s fifth single and the first from their second studio album, "Live
    Through This", in March 1994.'
- id: 230510cbd752
  source: hotpot:Softer, Softest
  title: Softer, Softest
  text: '"Softer, Softest" is a song by American alternative rock band Hole, written
    by frontwoman Courtney Love and lead guitarist Eric Erlandson.  The song was released
    as the band''s eighth single and fourth and final single from their second studio
    album, "Live Through This", in December 1995.  The single was released just as
    the band finished their extensive touring in 1995.'
- id: 667f2caddf8e
  source: hotpot:Courtney Love
  title: Courtney Love
  text: Courtney Michelle Love (born Courtney Michelle Harrison; July 9, 1964) is
    an American singer, songwriter, actress, and visual artist.  Prolific in the punk
    and grunge scenes of the 1990s, Love has enjoyed a career that spans four decades.  She
    rose to prominence as the frontwoman of the alternative rock band Hole, which
    she formed in 1989.  Love has drawn public attention for her uninhibited live
    performances and confrontational lyrics, as well as her highly publicized personal
    life following her marriage to Kurt Cobain.
- id: 979f4b219685
  source: hotpot:Catching Fire
  title: Catching Fire
  text: Catching Fire is a 2009 science fiction young adult novel by the American
    novelist Suzanne Collins, the second book in "The Hunger Games trilogy".  As the
    sequel to the 2008 bestseller "The Hunger Games", it continues the story of Katniss
    Everdeen and the post-apocalyptic nation of Panem.  Following the events of the
    previous novel, a rebellion against the oppressive Capitol has begun, and Katniss
    and fellow tribute Peeta Mellark are forced to return to the arena in a special
    edition of the Hunger Games.
- id: 1f922a92ea64
  source: hotpot:Oil well fire
  title: Oil well fire
  text: Oil well fires are oil or gas wells that have caught on fire and burn.  Oil
    well fires can be the result of human actions, such as accidents or arson, or
    natural events, such as lightning.  They can exist on a small scale, such as an
    oil field spill catching fire, or on a huge scale, as in geyser-like jets of flames
    from ignited high pressure wells.  A frequent cause of a well fire is a high-pressure
    blowout during drilling operations.
- id: 621e8cf51352
  source: 'hotpot:H2O: Footprints in the Sand'
  title: 'H2O: Footprints in the Sand'
  text: 'HO: Footprints in the Sand is a Japanese adult visual novel by Makura that
    was released on June 23, 2006 for the PC as a DVD; a version playable on the PlayStation
    2 under the title "HO +" followed on April 24, 2008 with adult content removed,
    but in its place will be additional scenarios and graphics not seen in the original
    release.  "HO" is Makura''s first game; a sequel named "Root After and Another"
    was later produced in October 2007.  The gameplay in "HO" follows a plot line
    that offers pre-determined scenarios with courses of interaction, and focuses
    on the appeal of the three female main characters.  There are two modes of gameplay,
    the Blindness Effect and Normal Effect, where the former plays on the fact that
    the protagonist is blind, and the latter mode removes the added element of gameplay
    the Blindness Effect has.  The story is broken into three parts: the original
    introduction and meeting, following by a separation and reunion, and finally ending
    with the protagonist choos'
- id: bb8defe5ec39
  source: hotpot:To Heart 2
  title: To Heart 2
  text: To Heart 2 (トゥハート２ , Tu Hāto 2 ) , stylized as ToHeart2, is a Japanese romance
    visual novel developed by Leaf and published by Aquaplus.  It was first released
    for the PlayStation 2 on December 28, 2004 as an all-ages title, and was followed
    by an adult version playable on Microsoft Windows and subsequent all-ages versions
    for the PlayStation Portable and PlayStation 3.  This deviated from the release
    history of the game's predecessor, "To Heart", which was originally released with
    adult content prior to receiving versions with such content removed.  The gameplay
    in "To Heart 2" follows a branching plot line with multiple endings, which offers
    pre-determined scenarios and courses of interaction based on the player's decisions.  Its
    story centers on the male protagonist Takaaki Kouno, and focuses on the appeal
    of the female main characters.
- id: 7cc70c9c3002
  source: hotpot:The Hunger Games (novel)
  title: The Hunger Games (novel)
  text: The Hunger Games is a 2008 dystopian novel by the American writer Suzanne
    Collins.  It is written in the voice of 16-year-old Katniss Everdeen, who lives
    in the future, post-apocalyptic nation of Panem in North America.  The Capitol,
    a highly advanced metropolis, exercises political control over the rest of the
    nation.  The Hunger Games is an annual event in which one boy and one girl aged
    12–18 from each of the twelve districts surrounding the Capitol are selected by
    lottery to compete in a televised battle to the death.
- id: b1299d5fd131
  source: hotpot:Moon (visual novel)
  title: Moon (visual novel)
  text: Moon (styled as Moon.)  is a Japanese adult visual novel developed by Tactics,
    a brand of Nexton, released on November 21, 1997 playable on Windows PCs.  The
    game was described by the development team as a "Reaching the Heart AVG" (心に届くAVG
    , Kokoro ni Todoku AVG ) .  The story follows the protagonist Ikumi Amasawa, a
    girl who joins an organization called Fargo in the hopes of discovering why and
    how her mother died, who was a member of the same group.  The gameplay in "Moon"
    follows a branching plot line which offers pre-determined scenarios with courses
    of interaction, and focuses on the three female main characters.  The game ranked
    twice in the national top 50 for best-selling PC games sold in Japan.
- id: eef6662d1f59
  source: hotpot:Dōsei
  title: Dōsei
  text: Dōsei (同棲 , lit. " Cohabitation") is a Japanese adult social simulation game
    developed by Tactics, a brand of Nexton.  It was released on May 23, 1997 for
    Windows PCs, the same day as "To Heart" by Leaf.  The gameplay in "Dōsei" follows
    a branching plot line which offers pre-determined scenarios with courses of interaction,
    and focuses on the appeal of the sole female main character Manami Minase.  The
    player assumes the role of protagonist Masaki Yamada who is living with Manami
    shortly after they have graduated from high school.  Masaki earns money at a job,
    and when he returns home will have sex with Manami often; this process of work
    in the day, and sex at night repeats many times throughout gameplay.
- id: e0be4415c627
  source: 'hotpot:The Hunger Games: Catching Fire'
  title: 'The Hunger Games: Catching Fire'
  text: 'The Hunger Games: Catching Fire is a 2013 American dystopian science fiction
    adventure film based on Suzanne Collins'' dystopian novel, "Catching Fire" (2009),
    the second installment in "The Hunger Games" trilogy.  The film is the sequel
    to "The Hunger Games" (2012) and the second installment in "The Hunger Games"
    film series, produced by Nina Jacobson and Jon Kilik, and distributed by Lionsgate.  Francis
    Lawrence directed the film, with a screenplay by Simon Beaufoy and Michael Arndt.  Adding
    to the existing cast, the supporting cast was filled out with Philip Seymour Hoffman,
    Jeffrey Wright, Jena Malone, Sam Claflin, Lynn Cohen, Amanda Plummer, Alan Ritchson,
    and Meta Golding.  Filming began on September 10, 2012, in Atlanta, Georgia, before
    moving to Hawaii.  The plot of "Catching Fire" takes place a few months after
    the previous installment; Katniss Everdeen and fellow District 12 tribute Peeta
    Mellark have returned home safely after winning the 74th Annual Hunger Games.  Throughout'
- id: f4edef97086d
  source: 'hotpot:Tenshin Ranman: Lucky or Unlucky!?'
  title: 'Tenshin Ranman: Lucky or Unlucky!?'
  text: 'Tenshin Ranman: Lucky or Unlucky!?  (天神乱漫 -LUCKY or UNLUCKY!? - ) is a Japanese
    adult visual novel developed by Yuzusoft, and released for the PC on May 29, 2009.  The
    game was later ported to the PlayStation Portable console by Russell on March
    25, 2010, under the title "Tenshin Ranman - Happy Go Lucky!!" .  The gameplay
    in "Tenshin Ranman" follows a plot line which offers pre-determined scenarios
    with courses of interaction, and focuses on the appeal of the four female main
    characters.  The story revolves around Haruki Chitose, the very unfortunate protagonist,
    and older brother of Sana Chitose.  One day, he receives a parcel containing something
    he would never have thought.'
- id: b0e890405183
  source: hotpot:Hello, Good-bye
  title: Hello, Good-bye
  text: Hello, Good-bye (ハローグッドバイ , Harō Guddobai ) is a Japanese adult visual novel
    developed and published by Lump of Sugar.  It was released on December 17, 2010
    for Windows as Lump of Sugar's sixth title.  A trial edition was released in October
    2010 rated for all ages.  The primary focus of the game is the appeal of the four
    female main characters.  The story resolves around the protagonist, Kaito Toubu,
    who is actually a secret agent with the ability to experience time loops.
- id: 36212bb99661
  source: hotpot:May 16 coup
  title: May 16 coup
  text: The May 16 coup (Hangul: 5.16 군사정변 ; Hanja: 五一六軍事政變 ; RR: "O-illyuk gunsa-jeongbyeon
    " ) was a military coup d'état in South Korea in 1961, organized and carried out
    by Park Chung-hee and his allies who formed the Military Revolutionary Committee,
    nominally led by Army Chief of Staff Chang Do-yong after the latter's acquiescence
    on the day of the coup.  The coup rendered powerless the democratically elected
    government of Yun Bo-seon and ended the Second Republic, installing a reformist
    military Supreme Council for National Reconstruction effectively led by Park,
    who took over as Chairman after General Chang's arrest in July.
- id: c2e8e46890af
  source: hotpot:Han Myeong-sook
  title: Han Myeong-sook
  text: 'Han Myeong-sook (born March 24, 1944; Korean: 한명숙 ] ) was the Prime Minister
    of South Korea from April 2006 to March 2007.  She is South Korea''s first female
    prime minister (second female prime minister overall if the acting premiership
    of Chang Sang is included).  She was from the United New Democratic Party (UNDP)
    as a member of the Korean National Assembly (representative) for Ilsan-gab, and
    is a graduate of Ewha Womans University in Seoul with a degree in French literature.  She
    resigned as Prime Minister on March 7, 2007 and declared her presidential candidacy.  But
    she did not succeed in the nominations.  In 2008 she ran for parliament, but was
    not elected.  However, in January 2012 she was elected leader of the main oppositional
    Democratic United Party (DUP) before the April legislative elections and became
    a member of parliament.  But the liberals did not manage to defeat the ruling
    Saenuri Party and Han stepped down as party leader in April 2012.  In August 2015,
    Han was convi'
- id: 0c60427557c0
  source: hotpot:Chang Dae-hwan
  title: Chang Dae-hwan
  text: Chang Dae-hwan (also Chang Dae-whan; born 21 March 1952) is a South Korean
    businessman.  He is best known as the president of the "Maeil Business Newspaper",
    South Korea's main business daily.  He also served a brief stint as South Korea's
    acting prime minister in August 2002 under president Kim Dae-jung, but the National
    Assembly voted not to confirm him.
- id: cf78adfd1166
  source: hotpot:Chang Won-jun
  title: Chang Won-jun
  text: 'Chang Won-jun (Hangul: 장원준, Hanja: 張元準) (born July 31, 1985 in Seoul) is
    a South Korean starting pitcher who currently plays for the Doosan Bears.  Chang
    played for the Lotte Giants in the Korea Baseball Organization from 2004 to 2011.  He
    bats and throws left-handed.'
- id: 90bfa7d9121e
  source: hotpot:Korea under Japanese rule
  title: Korea under Japanese rule
  text: Korea under Japanese rule began with the end of the short-lived Korean Empire
    in 1910 and ended at the conclusion of World War II in 1945.  Japanese rule of
    Korea was the outcome of a process that began with the Japan–Korea Treaty of 1876,
    whereby a complex coalition of the Meiji government, military, and business officials
    sought to integrate Korea both politically and economically into the Empire of
    Japan.  A major stepping-stone towards the Japanese occupation of Korea was the
    Japan–Korea Treaty of 1905, in which the then-Korean Empire was declared a protectorate
    of Japan.  The annexation of Korea by Japan was set up in the Japan–Korea Treaty
    of 1910, which was never actually signed by the Korean Regent, Gojong.
- id: 874e199a478d
  source: hotpot:Tommy Chang (martial artist)
  title: Tommy Chang (martial artist)
  text: Born and raised in Kyong Ki Do, South Korea, Master Tommy Chang is a Korean-Canadian
    world-renowned 7th degree Taekwondo and 8Th Degree Hapkido instructor and Grandmaster,
    actor, stunt performer, stunt coordinator and producer.  With over 40 years of
    training and experience in Taekwondo and Hapkido, Master Chang also trained extensively
    in ITF/WTF TKD, Moo Duk Kwan, and Judo.  He is also an 8th Degree Black Belt in
    Hap Ki-Do, specializing in pressure points, take-downs and grappling.  His martial
    arts expertise also encompasses mastery of several weapons.  In addition, he is
    a WTF-certified Master Instructor of Taekwondo and a Canadian National Referee
    (1st Class).
- id: 82f94e67e749
  source: hotpot:United States in the Korean War
  title: United States in the Korean War
  text: At the conclusion of World War II the Allied nations began the process of
    disarmament of Axis controlled regions.  Japan occupied Korea at this time and
    had been in control since 1910.  In 1945, the decision was made to have American
    Marines forces oversee Japanese surrender and disarmament south of the 38th parallel
    and the Soviet Union would facilitate the change of power to the north.  At the
    time there was no political motivation and seemed to be a logical and convenient
    plan of action.  The original agreement and intent was to create a unified and
    independent Korea out of the post Japanese occupation era.  Instead each side
    of the 38th parallel established its own government under the influence of the
    occupational country; the United States in South Korea and the Soviet Union in
    North Korea.  Both new Korean governments discredited the other and claimed to
    be the only legitimate political system.  Tensions between the North and South
    escalated and each side began to petition forei
- id: 67a14fc38e06
  source: hotpot:Chang Mi-hee
  title: Chang Mi-hee
  text: Chang Mi-hee (born December 8, 1958) is a South Korean actress active since
    1976.  She was born Lee Yun-hui in Seoul, South Korea in 1957.  Chang debuted
    as an actress in 1976 as starring in "Seong Chun-hyang jeon" directed by Park
    Tae-won and TBC TV drama, "Haenyeo Dang-sil" (Sea Woman Dang-sil).  Chang was
    commonly referred to as "New Troika" or "Second Troika" along with her rival actresses,
    Jeong Yun-hui and Yu Ji-in of the 1970s and 1980s after the "First Troika", Moon
    Hee, Nam Jeong-im, and Yoon Jeong-hee of the 1960s.
- id: cf7d445c5e65
  source: hotpot:Chang Yong-hak
  title: Chang Yong-hak
  text: Chang Yong-hak (25 April 1921 – 31 August 1999) was a Korean writer.  Chang
    was born in Hamyeong Buk-do in what is now North Korea.  He studied at Waseda
    University in Japan, before being drafted into the Japanese army.  After the end
    of World War Two, he taught high school in Korea, writing fiction on the side.
- id: bb074dbbc92b
  source: hotpot:Chang Ucchin
  title: Chang Ucchin
  text: Chang Ucchin (26 November 1917 – 27 December 1990) is one of the representatives
    of modern Korean fine art.  Chang was born when Korea was still under Japanese
    colonial rule.  He studied western art at Tokyo's Imperial School of Art.  He
    became a professor of fine arts at Seoul National University in 1954, but resigned
    to paint full-time from 1960.
- id: 4daaff27dbc0
  source: hotpot:Los Angeles County Federation of Labor
  title: Los Angeles County Federation of Labor
  text: The Los Angeles County Federation of Labor was started in 1885.  Originally,
    the Los Angeles County Federation of Labor was split into five individual unions
    of bakers, cigar makers, printers, tailors, and carpenters.  Now they represent
    over 300 unions, about 800,000 people, throughout Los Angeles County, making it
    the second largest in the country.  “A survey published in December 2003 showed
    that the three largest unions in the Los Angeles County Federation of Labor were
    SEIU 434B (with seventy-four thousand homecare and nursing home workers), SEIU
    399 with forty-five thousand health care and other employees, and the United Teachers
    of Los Angeles (with thirty thousand teachers from the American Federation and
    the National Education Association).”  They have helped make Los Angeles a union
    city.  Their mission is to “ promote a voice for workers through organizing themselves
    into unions, building strong coalitions of labor, community, faith, and responsible
    businesses, engaging in b
- id: 95390b4e35d9
  source: hotpot:Good Life Cafe
  title: Good Life Cafe
  text: The Good Life Cafe was a health food market and cafe in Los Angeles, California,
    known for its open mic nights that helped the 1990s Los Angeles alternative hip
    hop movement flourish.  In 2008, director Ava DuVernay, who had performed at the
    cafe with the Figures of Speech hip hop group, released a documentary about the
    cafe, "This Is The Life".  The film featured a number of hip hop artists discussing
    the importance of the Good Life Cafe to themselves and the hip hop scene.  The
    Cafe was open from 1989 to 1999.
- id: a26d50de73ab
  source: hotpot:Austin Young
  title: Austin Young
  text: Austin Young (born April 12, 1966) is an American photographer, film maker
    and new media artist currently based in Los Angeles.  His work has created an
    encyclopedic documentation of sub and trans culture in New York, Los Angeles and
    San Francisco.  Young's photographs have been featured in major publications such
    as Interview magazine, OK, and Flaunt and have been shown in solo exhibitions
    and projects at LACMA (Los Angeles, CA), Machine Project (Los Angeles, CA), Hammer
    Museum (Los Angeles, CA), Berkeley Art Museum (Berkeley, California); and as well
    as groups shows at Los Angeles Contemporary Exhibitions (Los Angeles, CA) and
    Stephen Cohen Gallery (Los Angeles, CA).  In addition to photography and film
    making, Young is co-founder of Fallen Fruit, an art collective who use fruit as
    a common denominator for public engagement and collaboration.
- id: 79f746f0edde
  source: hotpot:Old School (film)
  title: Old School (film)
  text: Old School is a 2003 American comedy film released by DreamWorks Pictures
    and The Montecito Picture Company and directed by Todd Phillips.  The story was
    written by Court Crandall, and the film was written by Phillips and Scot Armstrong.  The
    film stars Luke Wilson, Vince Vaughn, and Will Ferrell as three depressed thirty-somethings
    who seek to re-live their college days by starting a fraternity, and the tribulations
    they encounter in doing so.  Since its release it has gained a massive cult following,
    since a lot of minor characters in the film went on to have huge careers such
    as Simon Helberg, Elisha Cuthbert, Rob Corddry and Artie Lange.
- id: fc0f856636de
  source: hotpot:Stephen Nicholas (actor)
  title: Stephen Nicholas (actor)
  text: 'Stephen Nicholas (born 23 August 1978) also known as Stephen Charles Nicholas
    is an actor and presenter from Doncaster, South Yorkshire, England.  Stephen currently
    lives in Sheffield, his first role was on Sky One''s Dream Team, where he played
    Scott Ward.  From there, he filmed the first in the trilogy Goal!  (In which he
    played a Newcastle United Reserves player).  Following this, he moved to Los Angeles,
    where he played Smith in the feature film Futbaal: The Price of Dreams.  Stephen
    then returned to the UK to make a Bollywood film called Dhana Dhana Goal with
    John Abraham.  Stephen then experienced his first opportunity in reality TV with
    the show Premier League All Stars for Sky One, as well as playing a footballer,
    he was on-hand to present celebrity gossip and pitch side reports.  He then appeared
    in Celebrity Most Haunted and Date the Enemy.  From there he then went on to star
    in Goal 3 where he not only acted in the film he also became the football choreographer
    and choreograp'
- id: 97070d8c9778
  source: hotpot:John Miner
  title: John Miner
  text: Composer John Miner may be best known for his rock opera Heavens Cafe, which
    was staged at the Flamingo Theater in Las Vegas 1996, the Charleston Performing
    Arts Center in 1997, and later at Insurgo Theater in Los Angeles in 2004.  Miner
    formed the progressive rock group Art Rock Circus to perform the music with a
    live band on stage alongside the singers and actors.  Investor Mike Lewis was
    instrumental in financing and staging Heavens Cafe.  The Tributary Music Label
    released a live CD of Heavens Cafe to the progressive rock community in 2000.
- id: 230ca14fc49e
  source: hotpot:Quality Cafe
  title: Quality Cafe
  text: Quality Cafe is the name of two different former locations in Downtown Los
    Angeles, California.
- id: a2bfab252d29
  source: hotpot:Quality Cafe (jazz club)
  title: Quality Cafe (jazz club)
  text: Quality Cafe was a historical restaurant and jazz club located at 1143 East
    12th Street near the corner of Central Avenue in Downtown Los Angeles.  Quality
    Four, a jazz quartet founded by saxophonist Paul Howard and featuring young vibraphonist
    Lionel Hampton, was formed in 1924 to play at Quality Cafe.  The band soon became
    Quality Quintet and then Quality Serenades, and was disbanded after a tour with
    Hazel Myers later in the same year.  On June 7, 1924, the venue changed its name
    to Humming Bird Cafe and became "one of the hottest nightclubs in the area" under
    this name.
- id: 7af0d67892c5
  source: hotpot:Filandia, Quindío
  title: Filandia, Quindío
  text: Filandia is a town and municipality in the northern part of the department
    of Quindío, Colombia.  It is located on the west side of Cordillera Central of
    the Andes mountain range running through central Colombia, 26 km north of the
    departmental capital Armenia.  It is the northernmost of twelve municipalities
    that form Quindío, the second smallest department of Colombia.  It houses a small
    community economically supported by agriculture and tourism.  Although coffee
    is the major agricultural product, the municipality's diverse ecosystem makes
    it perfect for the production of numerous fruits and vegetables.  The population
    is evenly split between the urban and rural areas, with an urban population in
    the town of Filandia itself of nearly 7000 inhabitants and a population of around
    6500 in the rest of the municipality.  Most of the population is classified as
    mestizo (63,2%) and the most common religion is Roman Catholic.  The town's architecture,
    landscapes and the sociability of the lo
- id: 0b6c9a49c452
  source: hotpot:Quality Cafe (diner)
  title: Quality Cafe (diner)
  text: The Quality Cafe (also known as Quality Diner) is a now-defunct diner at 1236
    West 7th Street in Los Angeles, California.  The restaurant ceased to function
    as a diner in late 2006 but has appeared as a location featured in a number of
    Hollywood films, including "Training Day", "Old School", "Se7en", "Ghost World",
    "Gone in 60 Seconds", "The Stepfather", "What's Love Got to Do with It", "Sex
    and Death 101", and "Catch Me If You Can."  It was also featured in Season 1 of
    the 2007 television series "Mad Men," in the episode "5G".
- id: cefa89d94c37
  source: hotpot:Guess Who I Saw Today
  title: Guess Who I Saw Today
  text: '"Guess Who I Saw Today" is a popular jazz song written by Murray Grand with
    lyrics by Elisse Boyd.  The song was originally composed for Leonard Sillman''s
    Broadway musical revue "New Faces of 1952" in which it was sung by June Carroll.'
- id: 8f702faa7281
  source: hotpot:Paul Nassau
  title: Paul Nassau
  text: 'Paul David Nassau (January 30, 1930 in New York City – March 9, 2013 in Palm
    Beach Gardens) was an American composer and lyricist for the stage.  He contributed
    songs to the musical revue "New Faces of 1956", and wrote both the music and lyric
    to the Broadway shows "Happy Town" (1959), "A Joyful Noise" (1966), and "The Education
    of H*Y*M*A*N K*A*P*L*A*N" (1968).  He married Chloe Anderson on December 23, 1953.  The
    couple had two children: Robert and Julie.'
- id: dd9fec37c774
  source: hotpot:New Faces of 1952
  title: New Faces of 1952
  text: New Faces of 1952 is a musical revue with songs and comedy skits.  It ran
    on Broadway for nearly a year in 1952 and was then made into a motion picture
    in 1954.  It helped jump start the careers of several young performers including
    Paul Lynde, Alice Ghostley, Eartha Kitt, Robert Clary, Carol Lawrence, Ronny Graham,
    performer/writer Mel Brooks (as Melvin Brooks), and lyricist Sheldon Harnick.
- id: 0479bad259a2
  source: hotpot:Carol Lawrence
  title: Carol Lawrence
  text: Carol Lawrence (born September 5, 1932) is an American actress, most often
    associated with musical theatre, but who has also appeared extensively on television.
- id: 78303ba17676
  source: hotpot:Monotonous (song)
  title: Monotonous (song)
  text: '"Monotonous" is a popular song written by June Carroll and Arthur Siegel
    for Leonard Sillman''s Broadway revue "New Faces of 1952".  The song was written
    based on the experiences of its singer Eartha Kitt.  It was performed, at the
    insistence of Kitt, on three chaise longues (Kitt tried originally for six and
    was given three in compromise), crawling cat-like from one to the other, demonstrating
    her flexibility and her dance training from the Katherine Dunham Company.  The
    song also includes references to many well-known people of the 1950s.  People
    referenced in the song include:'
- id: c93bee92958c
  source: hotpot:How to Eat Like a Child
  title: How to Eat Like a Child
  text: How to Eat Like a Child – And Other Lessons in Not Being a Grown-up is an
    original musical comedy television special that aired on NBC on September 22,
    1981.  Based on Delia Ephron's best-selling book of the same name, and adapted
    for television by Judith Kahan with music and lyrics by John Forster, the one-hour
    special, through a series of comedy skits and songs, lampoons the adult world
    through the eyes of children.  The musical variety stars Dick Van Dyke as the
    resident "grown-up" alongside 15 children (8 boys and 7 girls) ranging in age
    from 7 to 13.  Several of the special's young performers would subsequently go
    on to achieve child stardom in their own right, most notably Corey Feldman, Billy
    Jacoby and Georg Olden.
