    on Park Avenue, the grade school of St. Ignatius's School on the north midblock
    location of 84th Street behind the church and the high school of Loyola School
    (also 980 Park Avenue) at the northwest corner of Park Avenue and 83rd Street.  In
    addition, another Jesuit high school, Reg
- id: b5b5cf9967e8
  source: hotpot:Squire Park, Seattle
  title: Squire Park, Seattle
  text: Squire Park is a district in the city of Seattle, in the U.S. state of Washington.  According
    to the Squire Park Community Council, it is bounded on the south by S. Jackson
    Street, on the west by 12th Avenue and 12th Avenue S., on the north by E. Union
    Street, and on the east by 23rd Avenue and 23rd Avenue S., placing it within what
    are commonly thought of as First Hill and the Central District.  Its main thoroughfares
    are E. Jefferson and Cherry Streets and E. Yesler Way (east- and west-bound) and
    14th Avenue (north- and south-bound).  Swedish Medical Center's Cherry Hill campus
    is located here, Seattle University, a Jesuit University has part of its campus
    in Squire Park, as the Admissions, some dormitories and Athletics departments
    are east of 12th Avenue.
- id: 500fe8f22c03
  source: hotpot:Hounsfield Heights/Briar Hill, Calgary
  title: Hounsfield Heights/Briar Hill, Calgary
  text: Hounsfield Heights/Briar Hill is an inner suburban neighbourhood in northwest
    Calgary, Alberta, Canada.  Located north of the Hillhurst and West Hillhurst communities,
    the boundaries of the district are 16th Avenue N (Trans-Canada Highway)to the
    north; 14th Street W to the east; Lane north of 7th Avenue N to 19th Street W
    and 8th Avenue N to the south; and Crowchild Trail, 12th Avenue N, Juniper Road,
    and 22nd Street W to the west.  Lions Park C-Train station is located within the
    community.  The community is built on an escarpment and is popular for its views
    of downtown to the south and the Rocky Mountains to the west.
- id: 1fb32f53539e
  source: hotpot:Greenwich Avenue
  title: Greenwich Avenue
  text: Greenwich Avenue, formerly Greenwich Lane, is a southeast-northwest avenue
    located in the Greenwich Village neighborhood of Manhattan, New York City.  It
    extends from the intersection of 6th Avenue and 8th Street at its southeast end
    to its northwestern end at 8th Avenue between 14th Street and 13th Street.  It
    is sometimes confused with Greenwich Street.  Construction of West Village Park,
    bounded by Greenwich Avenue, 7th Avenue, and 12th Street, began in 2016.
