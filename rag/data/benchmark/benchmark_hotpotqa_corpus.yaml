  source: hotpot:Mary Begoña
  title: Mary Begoña
  text: Mary Begoña (born 1929 in Bilbao, Spain) was the stage name of María Bragas
    Begoña who was a Spanish vedette and actress.  She started dancing at age 7 and
    performed in venues in Madrid while she was studying at the Academies of Quiroga,
    Ompín and Monreal.  Then she studied with Antonio Bautista and Sacha Goudine in
    Barcelona.  She debuted in a musical revue at the age of fourteen and during Spanish
    Civil War (from 1936 to 1939) was part of the CNT Union.  In 1943, Begoña worked
    in Valencia in Juanita Reina's acting troupe, but returned to Madrid to debut
    in the Teatro Calderón.  In 1945 she appeared in the revue "Danubio Azul" (Blue
    Danube) with Manolo Caracol and Lola Flores and the following year was the principal
    vedette in the revue "De la Tierra a Venus" (From the Earth to Venus).  For the
    next several years she performed in variety shows with various acting troupes,
    such as "Tres días para quererte" (1945), "¡Róbame esta noche!"  (1947), "A La
    Habana me voy" (1948).  In 1951, sh
- id: 5036e7d591ef
  source: hotpot:Leonard Sillman
  title: Leonard Sillman
  text: Leonard Sillman (May 9, 1908 - January 23, 1982) was an American Broadway
    producer.  Born in Detroit, Michigan on May 9, 1908, he was the brother of June
    Carroll, the brother-in-law of Sidney Carroll and the uncle of Steve Reich and
    Jonathan Carroll.  He is perhaps best known for his series of musical revues,
    "Leonard Sillman's New Faces", which introduced many major stars to Broadway audiences,
    such as Eartha Kitt, Inga Swenson, Paul Lynde and Maggie Smith.  Versions of "New
    Faces" were produced in 1934, 1936 (made into the film "New Faces of 1937"), 1943,
    1952 (made into the film "New Faces"), 1956, 1962 and 1968.  The very first "New
    Faces" in 1934 included actors Henry Fonda, Imogene Coca and Frances Dewey Wormser.
