    of which connect South Phoenix with the suburbs of Tempe and Chandler.  Major
    arterial south-north streets include 24th Street, 16th Street, 7th Street, Central
    Avenue, 7th Avenue, and 19th Avenue connecting South Mountain Village to Central
    and North Phoenix; 27th Avenue, 35th Avenue, 43rd Avenue, 51st Avenue, 59th Avenue,
    67th Avenue, and 75th'
