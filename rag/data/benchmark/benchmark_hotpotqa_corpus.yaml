  source: hotpot:655 Park Avenue
  title: 655 Park Avenue
  text: 655 Park Avenue is a Georgian-style co-op residential building on Manhattan's
    Upper East Side, located on Park Avenue between 67th Street and 68th Street, adjacent
    to the Park Avenue Armory.  It was developed in 1924 by Dwight P. Robinson & Company.  The
    building at 655 Park Avenue was designed by architects James Edwin Ruthven Carpenter,
    Jr., often referred to by the initials "J.E.R. Carpenter", and Mott B. Schmidt.  Carpenter
    is considered the leading architect for luxury residential high-rise buildings
    in New York City in the early 1900s, while Schmidt is known for his buildings
    in the American Georgian Classical style, including Sutton Place and houses for
    New York City's society figures and business elite.
