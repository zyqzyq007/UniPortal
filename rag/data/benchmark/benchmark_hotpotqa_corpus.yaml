  source: hotpot:Phthinosaurus
  title: Phthinosaurus
  text: Phthinosaurus is an extinct genus of therapsid from the Middle Permian of
    Russia.  The type species Phthinosaurus borrisiaki was named by Soviet paleontologist
    Ivan Yefremov in 1940 on the basis of an isolated lower jaw.  Because this jaw
    provides few distinguishing characteristics, the evolutionary relationships of
    "Phthinosaurus" are poorly known.  Yefremov named the family Phthinosuchidae in
    1954 to include "Phthinosaurus" and the newly named "Phthinosuchus", which was
    described on the basis of a crushed partial skull.  American paleontologist Everett
    C. Olson placed both of these therapsids in the larger infraorder Phthinosuchia
    in 1961.  In 1974 Leonid Tatarinov named the family Phthinosauridae to include
    "Phthinosaurus" alone, retaining "Phthinosuchus" within Phthinosuchidae.
- id: 996e29dd0309
  source: hotpot:Kate Dillon Levin
  title: Kate Dillon Levin
  text: Kate Dillon Levin (born March 2, 1974 in Washington D.C.) is an American model,
    activist and actress.  She is best known for her work as a plus-size model where
    she appeared in multiple editorials in fashion magazines, appeared in cosmetics,
    plus-size, and designer campaigns, worked with top photographers on campaigns
    and in editorials and appeared in many mass media outlets.  She was the first
    plus-size model to appear in U.S. Vogue and was the first plus-size model to appear
    in a Gucci campaign.  Dillon has also been involved with many non-profit organizations,
    and is an advocate for eating disorder awareness and treatment, sustainability,
    global poverty reduction and social justice.  She received her bachelor's degree
    in political science and international studies from University of St. Thomas and
    master's degree in international development from Harvard University's John F.
    Kennedy School of Government.  Dillon was briefly married to Gabe Levin.  During
    the marriage they had a son.
- id: 6eb83d227818
  source: hotpot:Tony Levin
  title: Tony Levin
  text: Anthony Frederick Levin (born June 6, 1946) is an American musician and composer,
    specializing in electric bass, Chapman Stick and upright bass.  He also sings
    and plays synthesizer.  Levin is best known for his work with King Crimson and
    Peter Gabriel.  He was also a member of Liquid Tension Experiment, Bruford Levin
    Upper Extremities, ProjeKct One, and ProjeKct Four.  He has led his own band,
    Stick Men.
- id: 4c345c8aa1c7
  source: hotpot:Gabriel Levin
  title: Gabriel Levin
  text: Gabriel Levin (Born 1948, Paris) is a poet, translator and essayist.  He lives
    in Jerusalem with his wife and children.  Levin is one of the founding editors
    of Ibis Editions, a small non-profit press devoted to the publication of the literature
    of the Levant, and serves as its Editor-at-large.  Levin's work has appeared in
    numerous literary magazines, including PN Review, The Times Literary Supplement,
    the Chicago Review, Raritan and Parnassus. "To these Dark Steps", a volume written
    in response to operation "Cast Lead" (2008), was set by British composer Alexander
    Goehr for tenor, children's choir, and ensemble and premiered September 2012 at
    the CBSO Centre in Birmingham.  Levin is the son of the American novelist Meyer
    Levin (best known for "Compulsion", the first "non-fiction novel") and French
    novelist Tereska Torres.
- id: fe9754f32e14
