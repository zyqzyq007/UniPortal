  source: hotpot:Benzamide
  title: Benzamide
  text: Benzamide is an off-white solid with the chemical formula of CHCONH.  It is
    a derivative of benzoic acid.  It is slightly soluble in water, and soluble in
    many organic solvents.
- id: 90936e4a6d1a
  source: hotpot:Gold(III) chloride
  title: Gold(III) chloride
  text: Gold(III) chloride, traditionally called auric chloride, is a chemical compound
    of gold and chlorine.  With the molecular formula AuCl, the name gold trichloride
    is a simplification, referring to the empirical formula, AuCl.  The Roman numerals
    in the name indicate that the gold has an oxidation state of +3, which is common
    for gold compounds.  There is also another related chloride of gold, gold(I) chloride
    (AuCl).  Chloroauric acid, HAuCl, the product formed when gold dissolves in aqua
    regia, is sometimes referred to as "gold chloride" or "acid gold trichloride".  Gold(III)
    chloride is very hygroscopic and highly soluble in water as well as ethanol.  It
    decomposes above 160 °C or in light.
- id: 36cff99a2dfe
  source: hotpot:Chloride
  title: Chloride
  text: The chloride ion is the anion (negatively charged ion) Cl.  It is formed when
    the element chlorine (a halogen) gains an electron or when a compound such as
    hydrogen chloride is dissolved in water or other polar solvents.  Chloride salts
    such as sodium chloride are often very soluble in water.  It is an essential electrolyte
    located in all body fluids responsible for maintaining acid/base balance, transmitting
    nerve impulses and regulating fluid in and out of cells.  Less frequently, the
    word "chloride" may also form part of the "common" name of chemical compounds
    in which one or more chlorine atoms are covalently bonded.  For example, methyl
    chloride, with the standard name chloromethane (see IUPAC books) is an organic
    compound with a covalent C−Cl bond in which the chlorine is not an anion.
