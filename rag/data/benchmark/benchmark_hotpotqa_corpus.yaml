  title: Berkeley, Denver
  text: Berkeley is a city-center neighborhood in Denver, Colorado, located in the
    area traditionally called Northwest Denver, on the west side of Interstate 25
    and just south of Interstate 70.  The neighborhood is bounded by Federal Boulevard
    on the east, I-70 on the north, Sheridan Boulevard on the West and 38th avenue
    on the south.  It is bordered by the West Highland neighborhood on the south and
    is often erroneously grouped together with the Highlands.  The neighborhood contains
    two lakes surrounded by parks, one eponymous (stretching from 46th Avenue to I-70
    and Sheridan Boulevard to Tennyson Street) and Rocky Mountain Lake Park (stretching
    from Lowell Boulevard to Grove Street and 46th Avenue to I-70).  Berkeley Park
    also contains the William Scheitler Recreation Center, run by the City and County
    of Denver and including both indoor and outdoor public pools.  Berkeley has experienced
    rapid growth and rise in property values in the last 20 years and particularly
    since the closing of Elit
- id: d4a0e18dc892
  source: hotpot:Church of St. Ignatius Loyola (New York City)
  title: Church of St. Ignatius Loyola (New York City)
  text: The Church of St. Ignatius of Loyola is a Roman Catholic parish church located
    on the Upper East Side of Manhattan, New York City, administered by the Society
    of Jesus (Jesuits).  The parish is under the authority of the Archdiocese of New
    York, and was established in 1851 as St. Lawrence O'Toole's Church.  In 1898,
    permission to change the patron saint of the parish from St. Lawrence O’Toole
    to St. Ignatius of Loyola was granted by Rome.  The address is 980 Park Avenue,
    New York City, New York 10028.  The church on the southwest corner of Park Avenue
