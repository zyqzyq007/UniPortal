- id: aeac11c18288
  source: hotpot:Pavel Urysohn
  title: Pavel Urysohn
  text: Pavel Samuilovich Urysohn (Па́вел Самуи́лович Урысо́н ) (February 3, 1898
    – August 17, 1924) was a Soviet mathematician of Jewish origin who is best known
    for his contributions in dimension theory, and for developing Urysohn's Metrization
    Theorem and Urysohn's Lemma, both of which are fundamental results in topology.  His
    name is also commemorated in the terms Urysohn universal space, Fréchet–Urysohn
    space, Menger–Urysohn dimension and Urysohn integral equation.  He and Pavel Alexandrov
    formulated the modern definition of compactness in 1923.
- id: e790933dc980
  source: hotpot:Meyer Levin
  title: Meyer Levin
  text: Meyer Levin (October 7, 1905 – July 9, 1981) was an American novelist.  Perhaps
    best known for his work on the Leopold and Loeb case, Levin worked as a journalist
    (for the "Chicago Daily News" and, from 1933–39, as an editor for "Esquire").
