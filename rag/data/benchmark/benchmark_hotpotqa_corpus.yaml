  source: hotpot:750 7th Avenue
  title: 750 7th Avenue
  text: 750 Seventh Avenue is a 615 ft (187m) tall Class-A office skyscraper in New
    York City.  It was completed in 1989 in the postmodern style and has 36 floors.  Kevin
    Roche John Dinkeloo & Associates designed the building, and it is owned by Hines,
    a Texas based real estate investment company.  The building's continuous helix
    design, culminating in a chimney-like extension, was caused by the New York City
    Building Code, which requires setbacks.  The 84 exterior column transfers exist
    because of the owner's requirement for a column-free space.  It is tied with the
    New York Life Building for the 74th tallest building in New York City.  It is
    also LEED certified.
