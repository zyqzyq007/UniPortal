  text: Rusty Nail and Tetanus It is commonly advised that people should avoid rusty
    nails because they are dangerous. One of the most common beliefs is that piercing
    the skin with a rusty nail can cause you to develop tetanus or lockjaw. Tetanus
    is referred to as lockjaw because the initial symptoms of the disease will cause
    the muscles around the mouth to become rigid.
