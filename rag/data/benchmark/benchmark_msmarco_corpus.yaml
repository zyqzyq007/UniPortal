  text: It is possible to contract tetanus if you are cut by a rusty nail. Tetanus
    is caused by the clostridium tetani bacteria which are commonly found in dust,
    soil and animal feces. Because these items are commonly found around areas like
    gardens or work sites where rusty nails are present, the general belief that rusty
    nails cause tetanus was born. It is important to note that it is not so much the
    rust on the nail that causes people to contract tetanus, but the fact that nails
    can cause deep wounds that make it easier for the tetanus infection to spread.
