    Calomel occurs as a secondary mineral which forms as an alteration product in
    mercury deposits. It occurs with native mercury, amalgam, cinnabar, mercurian
    tetrahedrite, eglestonite, terlinguaite, montroydite, kleinite, moschelite, kadyrelite,
    kuzminite, chursinite, kelyanite, calcite, limonite and various clay minerals.
