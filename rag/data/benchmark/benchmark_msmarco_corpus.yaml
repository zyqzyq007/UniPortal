  text: If you take an iron nail and let it rust in air, you'll find that the weight
    of the rusted nail is larger than that of the nail before it rusted. This gives
    the impression that the amount of mass hasn't remained constant, but what has
    really happened is that the oxygen in the air (which you didn't weigh) combined
    with the iron to make it rust. As a result, the weight of the oxygen plus the
    weight of the iron is equal to the weight of the rust that's formed. OK.
