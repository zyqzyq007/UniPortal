  text: In xylem vessels water travels by bulk flow rather than cell diffusion. In
    phloem, concentration of organic substance inside a phloem cell (e.g., leaf) creates
    a diffusion gradient by which water flows into cells and phloem sap moves from
    source of organic substance to sugar sinks by turgor pressure.
