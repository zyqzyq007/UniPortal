  title: passage_1
  text: In addition to having sensory properties, a cat's whiskers are also a good
    indicator of his mood. When a cat is angry or feels defensive, the whiskers will
    be pulled back. Otherwise, when the cat is happy, curious or content, the whiskers
    will be more relaxed and pushed forward. But the whisker's primary use is to help
    a cat judge whether or not he'll fit through an opening. A cat's whiskers are
    roughly as wide as his body -- sort of a natural ruler. The whisker tips are sensitive
    to pressure. You'll probably see a cat stick his head in and out of an opening
    before he puts his body in. He's judging the width of the opening, and is determining
    if he can fit into it.
- id: 38b56d14078d
  source: msmarco
  title: passage_2
  text: Yes whiskers are used to help balance as well as feelers to help them judge
