  text: 'Tutorial: Introduction to Restorative Justice. Restorative justice is a theory
    of justice that emphasizes repairing the harm caused by criminal behaviour. It
    is best accomplished through cooperative processes that include all stakeholders.
    This can lead to transformation of people, relationships and communities. Practices
    and programs reflecting restorative purposes will respond to crime by: 1  identifying
    and taking steps to repair harm, 2  involving all stakeholders, and. 3  transforming
    the traditional relationship between communities and their governments in responding
    to crime.'
- id: 63859e263b7c
