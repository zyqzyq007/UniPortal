- id: 4fb1d0c43ccb
  source: msmarco
  title: passage_3
  text: 'The Cat Fanciers’ Association (which is to cats what the AKC is to dogs)
    has this listed on its page of myths about cats (http://www.cfainc.org/articles/myths-facts
    .html) Myth: A cat’s sense of balance is in its whiskers. Fact: Cats use their
    whiskers as “feelers” but not to maintain their balance. So you aren’t the only
    one to hear this old wives’ tale, but you can put the scissors away, even though
    it was in the name of scientific curiosity.'
- id: 7858756f55d6
  source: msmarco
  title: passage_4
  text: Like cats and other animals, dogs have whiskers that stick out from the sides
    of their muzzle. Technically, they aren’t whiskers – they’re called vibrissae,
    which comes from a Latin word “vibrio” that means to vibrate. A dog’s whiskers
    are actually highly tuned, multi-functional, sensitive sensory hairs they need
    and use every day to perform specific functions that help them move around in
    their world. Dog whiskers are found on both sides of their muzzle, as well as
    on the forehead above the eyes, on their chin and above the upper lip.
- id: ab732f6837cc
  source: msmarco
  title: passage_5
  text: Whiskers are rooted very deep in the cat's face, in an area rich in nerves
    and blood vessels. In addition to having the long tactile hairs on their cheeks,
    cats also have shorter ones above their eyebrows, on their chin and on the back
    of their front legs.
- id: 5a170233b9f1
  source: msmarco
  title: passage_6
  text: As puppies grow, the whiskers are among the first hairs to develop. Unlike
    the neatly arranged 12 whiskers in four rows on each side of a cat’s face, dog
    whiskers are more varied in their pattern depending on their breed and genetics.
    Whiskers are twice as thick and coarser than regular dog hair.
