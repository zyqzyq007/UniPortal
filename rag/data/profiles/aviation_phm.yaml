refusal_message: |
  未在维修手册中找到与该问题直接相关的依据。

  建议：
  1. 提供更多故障现象细节（如故障代码、参数读数、发生工况）；
  2. 查阅对应机型的原始维修手册；
  3. 联系专业技术人员进一步诊断。

empty_context_message: 当前知识库中暂无相关文档。请先通过文档管理页面上传排故手册、维修手册等资料，然后再进行提问。

retriever_tool_description: "搜索并返回关于飞机故障分析、排故程序、维修手册、故障代码的信息, 内容涵盖：飞机各系统（发动机、液压、航电、结构等）的故障诊断、排故流程、维修方案和技术通报"

pii_operational_patterns:
  - name: tail_number
    pattern: '\b(B|N|G|CC)-\d{1,5}[A-Z]?\b'
    kind: tail_number
  - name: msn
    pattern: '\bmsn[\s\-_:]*\d{3,6}\b'
    kind: msn

# GraphRAG 抽取种子（docs/specs/graphrag）。抽取 prompt 从这里派生实体/关系类型，
# 不在源码硬编码领域字面量。空字段会回落到通用种子；这里给出 PHM 领域种子。
entity_types:
  - 部件
  - 系统
  - 故障代码
  - ATA章节
  - 症状
  - 排故程序
  - 参数
  - 机型
relation_types:
  - 导致
  - 属于
  - 排故程序
  - 相关
  - 引发
  - 组成
