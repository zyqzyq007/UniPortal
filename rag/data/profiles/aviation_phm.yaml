# 能力/身份问题识别(Bug2 Layer ①)。与 general 一致;PHM 领域的 identity_response
# 在下方 identity_response 段定义。substring + regex 双轨,regex 是模糊兜底。
capability_keywords:
  - 你是谁
  - 你能做什么
  - 你会什么
  - 你的功能
  - 介绍你
  - who are you
  - what can you do

capability_patterns:
  - '你是(谁|干什么的|什么)'
  - '你(能|可以|会)(做|解决|处理|帮|回答).{0,6}(什么|哪些|问题|任务|功能)'
  - '介绍.{0,2}你'
  - '你的功能'
  - '(who are you|what can you do)'

# query 增强识别的 regex 模式(如 ATA 章节编号)
query_patterns:
  - '\bata[\s\-_:]*\d{2}\b'

# 查询变换选择启发式(retrieve skill ``_decide_transform`` 用):
# anchor_patterns = 精确锚点(ATA/故障码/EICAS 码),命中→跳过变换直接检索;
# diagnostic_keywords = 诊断动词,命中→hyde;
# symptom_keywords = 抽象症状词,短查询命中→multi_query。
# 这些正则/词表从原 retrieve skill 硬编码迁移而来,aviation 行为零变化。
query_anchor_patterns:
  # ATA 章节(与 query_patterns 的 ATA 检测一致)
  - '\bata[\s\-_:]*\d{2}'
  # EICAS 风格故障码(E1A02/FQ01/HYD3) + 显式"故障码:"标记
  - '\b[A-Z]\d[A-Z0-9]{1,}\b'
  - '[A-Z]{2,}\d{2,}'
  - '故障码[:：]?\s*\S+'
diagnostic_keywords:
  - 如何
  - 为什么
  - 原因
  - 排查
  - 怎样
  - 怎么办
  - 诊断
