# General domain profile — 领域无关通用知识助手(默认 profile)
#
# 不锁定任何领域:中性 prompts、空输出结构模板(不强制 section)、
# 空领域关键词(意图分类走 LLM,不靠领域关键词 fast-path)。
# 用法:默认即 general;航空场景设 env DOMAIN_PROFILE=aviation_phm。

name: general
display_name: 通用知识助手
profile_label: general
# prompt_profile_generate 标签后缀(领域无关,生成标签为 general_v1)。
profile_suffix: v1

# prompts 字段缺省时用 general 内置默认值填充(见 domain_profile._general_defaults),
# 故此处只列与默认不同的覆盖项。完全使用默认即领域无关。

# 不强制任何输出结构 —— 回答按检索内容自然组织。
section_template: []
structure_hint: ""

# 不预设领域关键词:意图分类完全走 LLM,避免把任意含"诊断/检查"的查询
# 误判为某领域 RAG。闲聊关键词保留通用问候。
rag_keywords: []
chat_keywords:
  - 你好
  - 谢谢
  - 再见
  - 你是谁
  - 你能做什么
  - hello
  - hi
  - thanks
  - bye

# 能力/身份问题识别(Bug2 Layer ①)。substring 触发词 + 下方 regex 模糊兜底,
# 共同判定"你是谁/你能做什么"类自指问题,命中即返回 identity_response。
# regex 层是模糊兜底,故关键词列表无需穷举——Layer ② 置信度门禁兜底未命中项。
capability_keywords:
  - 你是谁
  - 你能做什么
  - 你会什么
  - 你的功能
  - 介绍你
  - who are you
  - what can you do

capability_patterns:
  - '你是(谁|干什么的|什么)'
  - '你(能|可以|会)(做|解决|处理|帮|回答).{0,6}(什么|哪些|问题|任务|功能)'
  - '介绍.{0,2}你'
  - '你的功能'
  - '(who are you|what can you do)'

# 无领域特定的 query 模式。
query_patterns: []

refusal_message: |
  未在知识库中找到与该问题直接相关的依据。

  建议：
  1. 提供更多细节或换一种表述；
  2. 上传相关文档扩充知识库；
  3. 联系相关人员。

empty_context_message: 当前知识库中暂无相关文档。请先上传资料后再提问。

retriever_tool_description: "搜索并返回知识库中与查询相关的文档片段。"

# 通用 profile 不启用领域特定的 operational id 检测。
pii_operational_patterns: []
